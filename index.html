function normalizeApiBase(v){ return String(v||'').trim().replace(/\/+$/,''); }
function getBotApiBase(){
  try{
    const q = new URLSearchParams(location.search).get('api');
    if(q) return normalizeApiBase(q);
    const saved = localStorage.getItem('ftw_bot_api');
    if(saved) return normalizeApiBase(saved);
  }catch(e){}
  return BOT_API_DEFAULT;
}

/* ═══ THEME ═══ */
const THEME_KEY = 'ftw_theme';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function palette(){ return { iris: cssVar('--iris'), mint: cssVar('--mint'), violet: cssVar('--violet'), amber: cssVar('--amber'), rose: cssVar('--rose'), text2: cssVar('--text-2'), line: cssVar('--line'), panel: cssVar('--panel') }; }
function withAlpha(hex, a){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
  if(!m) return hex;
  return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})`;
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }
function applyTheme(theme, animate){
  const root = document.documentElement;
  if(animate && !reduceMotion){ root.classList.add('theming'); setTimeout(()=>root.classList.remove('theming'), 480); }
  root.setAttribute('data-theme', theme);
  root.style.colorScheme = theme;
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  requestAnimationFrame(syncChartTheme);
}
function toggleTheme(){ applyTheme(currentTheme()==='dark' ? 'light' : 'dark', true); }
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(saved !== 'light' && saved !== 'dark'){ saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  document.documentElement.setAttribute('data-theme', saved);
  document.documentElement.style.colorScheme = saved;
})();
function syncChartTheme(){
  if(!window.Chart) return;
  Chart.defaults.color = cssVar('--text-2');
  Chart.defaults.borderColor = cssVar('--line');

}

/* ═══ HELPERS ═══ */
function toast(message, ok = true){
  const el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'toast show' + (ok ? '' : ' error');
  el.setAttribute('role', ok ? 'status' : 'alert');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2900);
}
function hdr(){ return {'Content-Type':'application/json','X-Session':SESSION}; }
function val(id){ return document.getElementById(id).value.trim(); }
function fmtTime(ts){ return ts ? new Date(ts*1000).toLocaleString() : '—'; }
function fmtRel(ts){
  if(!ts) return '—';
  const d = Date.now()/1000 - ts;
  if(d < 60) return 'just now';
  if(d < 3600) return Math.floor(d/60) + ' min ago';
  if(d < 86400) return Math.floor(d/3600) + ' h ago';
  return Math.floor(d/86400) + ' d ago';
}
function bust(url){
  if(!url || typeof url !== 'string' || !url.startsWith('http')) return url;
  const bucket = Math.floor(Date.now() / (5 * 60 * 1000));
  return url + (url.includes('?') ? '&' : '?') + '_v=' + bucket;
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function animateNumber(el, target){
  if(!el) return;
  const to = Number(target);
  if(!Number.isFinite(to)){ el.textContent = target ?? '—'; return; }
  const from = Number(el.dataset.num || 0);
  el.dataset.num = to;
  if(reduceMotion || from === to){ el.textContent = to.toLocaleString(); return; }
  el.classList.remove('kpi-bump'); void el.offsetWidth; el.classList.add('kpi-bump');
  const t0 = performance.now(), dur = 700;
  (function tick(t){
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e).toLocaleString();
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
}
function setKpi(id, value){ animateNumber(document.getElementById(id), value); }

function setApiState(online, message){
  API_ONLINE=!!online;
  const pill=document.getElementById('api-status-pill'), txt=document.getElementById('api-status-text');
  if(pill){ pill.classList.toggle('online',API_ONLINE); pill.classList.toggle('offline',!API_ONLINE); }
  if(txt) txt.textContent=message || (API_ONLINE?'Bot API online':'Bot API offline');
  const svc=document.getElementById('svc-api'); if(svc) svc.textContent=API_ONLINE?'Connected':'Offline';
  updateSyncIndicator();
}
async function checkApiHealth(silent=true){
  const candidates=[BOT_API_DEFAULT, BOT_API, ...BOT_API_FALLBACKS]
    .map(normalizeApiBase).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
  for(const base of candidates){
    try{
      const r=await fetch(base+'/api/health',{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      API_ACTIVE_BASE=base; BOT_API=base; setApiState(true,'Bot API online'); return true;
    }catch(e){}
  }
  setApiState(false,'Bot API offline');
  if(!silent) toast('The bot is offline — no endpoint answered.',false);
  return false;
}
async function fetchApi(path, options={}){
  const ordered = [BOT_API_DEFAULT, API_ACTIVE_BASE, BOT_API, ...BOT_API_FALLBACKS]
    .map(normalizeApiBase).filter(Boolean);
  const seen = []; let last = null;
  for(const base of ordered){
    if(seen.includes(base)) continue;
    seen.push(base);
    try{
      const r = await fetch(base + path, options);
      API_ACTIVE_BASE = base; BOT_API = base;
      setApiState(true, 'Bot API online');
      return r;
    }catch(e){ last = e; }
  }
  setApiState(false, 'Bot API offline');
  throw last || new Error('Bot API unavailable');
}
async function apiFetch(url, options={}){
  const isAbsolute = /^https?:\/\//i.test(url);
  const candidates = isAbsolute ? [url]
    : [BOT_API_DEFAULT, BOT_API, ...BOT_API_FALLBACKS].map(normalizeApiBase).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
  let lastErr = null;
  for(const base of candidates){
    const target = isAbsolute ? url : (base + url);
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 90000);
    try{
      const r = await fetch(target, { ...options, signal: controller.signal, cache: 'no-store' });
      setApiState(true, 'Bot API online');
      if(!isAbsolute){ BOT_API = base; API_ACTIVE_BASE = base; }
      return r;
    }catch(e){ lastErr = e; if(e?.name === 'AbortError') break; }
    finally{ clearTimeout(timeout); }
  }
  setApiState(false, 'Bot API offline');
  if(lastErr?.name === 'AbortError') throw new Error('Request timed out.');
  throw new Error('The bot is offline — no endpoint answered.');
}
function openApiSettings(){ nav('waveshield'); }

/* ═══ BANNED SCREEN ═══ */
function showBannedScreen(info){
  const overlay = document.getElementById('banned-screen');
  const sub = document.getElementById('banned-sub');
  const meta = document.getElementById('banned-meta');
  if(sub && info?.display_name){
    sub.textContent = `The Discord account ${info.display_name} is banned from this dashboard.`;
  }
  if(meta){
    const added = info?.banned_at ? new Date(info.banned_at * 1000).toLocaleString() : '—';
    meta.innerHTML = `
      <div class="row"><span class="k">Discord ID</span><span class="v">${esc(info?.user_id || '—')}</span></div>
      <div class="row"><span class="k">Reason</span><span class="v">${esc(info?.reason || '—')}</span></div>
      <div class="row"><span class="k">Banned since</span><span class="v">${esc(added)}</span></div>
    `;
  }
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden','false');
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.remove('visible');
}

/* ═══ SIGN IN ═══ */
let PREAUTH = null, PREAUTH_USER = null;
function showAuthError(message){
  const err = document.getElementById('auth-error');
  err.textContent = message; err.style.display = 'block';
}
function cancelAuth(){
  PREAUTH = null; PREAUTH_USER = null;
  document.getElementById('auth-step-1').style.display = '';
  document.getElementById('auth-step-2').style.display = 'none';
  document.getElementById('auth-step-loading').style.display = 'none';
  document.getElementById('auth-title').textContent = 'Sign in';
  document.getElementById('auth-error').style.display = 'none';
}
async function handleOAuthCallback(code){
  document.getElementById('auth-step-1').style.display = 'none';
  document.getElementById('auth-step-2').style.display = 'none';
  document.getElementById('auth-step-loading').style.display = '';
  document.getElementById('auth-title').textContent = 'One moment';
  try{
    const r = await fetchApi('/api/oauth/exchange', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({code})
    });
    const d = await r.json().catch(()=>({}));
    if(r.status === 403 && d && d.banned){ showBannedScreen(d); return; }
    document.getElementById('auth-step-loading').style.display = 'none';
    if(!r.ok){
      showAuthError(d.error || 'Discord would not confirm that authorization. Try again.');
      document.getElementById('auth-step-1').style.display = '';
      document.getElementById('auth-title').textContent = 'Sign in';
      return;
    }
    PREAUTH = d.preauth; PREAUTH_USER = d.user;
    document.getElementById('auth-user').textContent = PREAUTH_USER.display_name || PREAUTH_USER.username || PREAUTH_USER.id;
    document.getElementById('auth-title').textContent = 'Enter your password';
    document.getElementById('auth-step-2').style.display = '';
    setTimeout(()=>document.getElementById('in-pw').focus(), 90);
  }catch(e){
    document.getElementById('auth-step-loading').style.display = 'none';
    showAuthError('The bot is offline. Check the bot API URL and try again.');
    document.getElementById('auth-step-1').style.display = '';
    document.getElementById('auth-title').textContent = 'Sign in';
  }
}
async function doLogin(){
  const pw = document.getElementById('in-pw').value;
  const btn = document.getElementById('btn-login');
  document.getElementById('auth-error').style.display = 'none';
  if(!PREAUTH){ showAuthError('Authorize with Discord first.'); return; }
  if(!pw){ showAuthError('Your password is missing.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    const r = await fetchApi('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({preauth: PREAUTH, password: pw})
    });
    const data = await r.json().catch(()=>({}));
    if(r.status === 403 && data && data.banned){ showBannedScreen(data); return; }
    if(!r.ok) throw new Error(data.error || 'login failed');
    SESSION = data.token; USER = data.user;
    try{ localStorage.setItem('ftw_session', SESSION); }catch(e){}
    PREAUTH = null;
    enterApp();
    await bootData();
    if(isOwner()) await loadStaff();
  }catch(e){
    if(e.message === 'invalid password') showAuthError('That password does not match.');
    else if(e.message === 'preauth invalid or expired') showAuthError('That took too long. Authorize with Discord again.');
    else showAuthError(e.message);
  }finally{ btn.disabled = false; btn.textContent = 'Sign in'; }
}
function enterApp(){
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  applyUser();
  if(isOwner()) startPulse();
  setTimeout(syncEverything, 400);
  startGlobalSync();
}
async function bootData(){
  const jobs = [loadConfig(), loadHealth()];
  if(isOwner()){
    jobs.push(loadProfile(), loadLiveServer(), loadProCenter(), loadAnalytics());
  }
  await Promise.all(jobs);
}
function doLogout(){
  if(SESSION) fetchApi('/api/logout',{method:'POST',headers:hdr()}).catch(()=>{});
  [statusTimer,logsTimer,auditTimer,liveServerTimer,globalSyncTimer].forEach(t=>{ if(t) clearInterval(t); });
  globalSyncTimer = null;
  try{ localStorage.removeItem('ftw_session'); }catch(e){}
  location.reload();
}
function isOwner(){ return USER && USER.role === 'owner'; }
function canOpen(page){
  if(!USER) return false;
  if(isOwner() || USER.full_control || USER.manage_access) return true;
  if(page === 'ipguard') return false;
  return PAGES.includes(page) && !!(USER.perms || {})[page];
}
function applyUser(){
  document.getElementById('who').textContent = USER.name + (isOwner() ? ' · owner' : ' · staff');
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>{ n.classList.toggle('hidden', !canOpen(n.dataset.page)); });
  document.getElementById('nav-staff').style.display = (isOwner() || USER.full_control || USER.manage_access) ? '' : 'none';
  const banBtn = document.getElementById('ban-user-btn');
  if(banBtn) banBtn.classList.toggle('visible', isOwner());
  const ipNav = document.getElementById('nav-ipguard');
  if(ipNav) ipNav.classList.toggle('hidden', !isOwner());
  document.querySelectorAll('#sidebar .nav-section').forEach(sec=>{
    let el = sec.nextElementSibling, any = false;
    while(el && el.classList.contains('nav-item')){ if(!el.classList.contains('hidden')) any = true; el = el.nextElementSibling; }
    sec.classList.toggle('hidden', !any);
  });
  const allowed = [...document.querySelectorAll('.nav-item[data-page]:not(.hidden)')];
  if(!allowed.length){ showNoAccess(); return; }
  const current = document.querySelector('.page.active')?.id.replace('page-','');
  if(!canOpen(current)) nav(allowed[0].dataset.page);
}
function showNoAccess(){
  document.getElementById('content').innerHTML = '<div class="card"><div class="empty-state"><strong>No pages assigned to you yet</strong>Ask the server owner to tick the pages you need on the staff page.</div></div>';
  document.getElementById('topbar-title').textContent = 'No access';
  document.getElementById('topbar-sub').textContent = 'Nothing has been shared with this account';

function openBanModal(){
  if(!isOwner()){ toast('Only the owner can ban users', false); return; }
  const m = document.getElementById('ban-modal');
  m.classList.add('open'); m.setAttribute('aria-hidden','false');
  document.getElementById('ban-user-id').value = '';
  document.getElementById('ban-reason').value = '';
  document.getElementById('ban-action').value = 'ban';
  document.getElementById('ban-duration').value = '600';
  document.getElementById('ban-duration-wrap').style.display = 'none';
  document.getElementById('ban-dm').checked = false;
  document.getElementById('ban-also-waveshield').checked = true;
  const s = document.getElementById('ban-status'); s.className = 'ban-status'; s.textContent = '';
  setTimeout(()=>document.getElementById('ban-user-id').focus(), 90);
}
function closeBanModal(){
  const m = document.getElementById('ban-modal');
  m.classList.remove('open'); m.setAttribute('aria-hidden','true');
}
async function submitBan(){
  if(!isOwner()){ toast('Only the owner can ban users', false); return; }
  const uid = document.getElementById('ban-user-id').value.trim();
  const action = document.getElementById('ban-action').value;
  const reason = document.getElementById('ban-reason').value.trim() || 'From dashboard';
  const duration = Number(document.getElementById('ban-duration').value) || 600;
  const dm = document.getElementById('ban-dm').checked;
  const mirror = document.getElementById('ban-also-waveshield').checked;
  const status = document.getElementById('ban-status');
  const btn = document.getElementById('ban-confirm-btn');
  if(!/^\d{15,25}$/.test(uid)){
    status.className = 'ban-status err';
    status.textContent = 'Enter a valid Discord user ID (15–25 digits).';
    return;
  }
  btn.disabled = true;
  status.className = 'ban-status'; status.textContent = 'Sending…';
  try{
    const body = { user_id: uid, action, reason };
    if(action === 'timeout') body.duration = duration;
    const r = await fetchApi('/api/action/punish', {method: 'POST', headers: hdr(), body: JSON.stringify(body)});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || 'The bot refused the action');
    if(dm && (action === 'ban' || action === 'kick' || action === 'timeout')){
      try{ await fetchApi('/api/action/dm', {method: 'POST', headers: hdr(), body: JSON.stringify({ user_id: uid, content: `You have been **${action}ed** from the server.\nReason: ${reason}` })}); }catch(e){}
    }
    if(mirror){
      try{
        const wsKey = (localStorage.getItem('ftw_waveshield_api_key') || '').trim();
        const wsBase = (localStorage.getItem('ftw_waveshield_api_url') || 'https://api.waveshield.xyz').replace(/\/+$/,'');
        if(wsKey){
          await fetch(wsBase + '/v1/bans', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + wsKey, 'X-API-Key': wsKey },
            body: JSON.stringify({ serverId: 'f4579c62-bb22-4634-b444-a581ba0f6068', reason: reason, playerName: 'Discord ' + uid, identifiers: [{ type: 'discord', value: uid }] })
          }).catch(()=>{});
        }
      }catch(e){}
    }
    status.className = 'ban-status ok';
    status.textContent = `✅ ${action} applied to ${uid}.`;
    toast(`${action.charAt(0).toUpperCase()+action.slice(1)} applied`);
    setTimeout(closeBanModal, 900);
  }catch(e){
    status.className = 'ban-status err';
    status.textContent = '❌ ' + (e.message || 'The action failed.');
    toast(e.message || 'Action failed', false);
  }finally{ btn.disabled = false; }
}
document.addEventListener('change', e => {
  if(e.target && e.target.id === 'ban-action'){
    document.getElementById('ban-duration-wrap').style.display = e.target.value === 'timeout' ? '' : 'none';
  }
});

/* ═══ PROFILE ═══ */
async function loadProfile(){
  try{
    const r = await fetchApi('/api/profile',{headers:hdr()});
    if(!r.ok) return;
    const p = await r.json();
    document.getElementById('pf-avatar').src = bust(p.avatar) || '';
    document.getElementById('pf-name').textContent = p.display_name || p.username;
    document.getElementById('pf-username').textContent = '@' + p.username;
    document.getElementById('pf-id').textContent = p.id;
    document.getElementById('pf-created').textContent = fmtTime(p.created_at);
    document.getElementById('pf-joined').textContent = p.joined_at ? fmtTime(p.joined_at) : 'not in this server';
    const rolesEl = document.getElementById('pf-roles'); rolesEl.innerHTML = '';
    if(p.role === 'owner'){ const b = document.createElement('span'); b.className = 'role-badge owner'; b.textContent = 'Owner'; rolesEl.appendChild(b); }
    (p.roles || []).forEach(role=>{
      if(role.is_default) return;
      const b = document.createElement('span');
      b.className = 'role-badge'; b.textContent = role.name;
      if(role.colour && role.colour !== '#000000'){ b.style.borderColor = role.colour; b.style.color = role.colour; }
      rolesEl.appendChild(b);
    });
    applyServerProfile({}, {}, p);
  }catch(e){}
}

/* ═══ LIVE SERVER ═══ */
function firstDefined(...vals){ return vals.find(v=>v!==undefined && v!==null && v!==''); }
function safeText(v, fallback='—'){ return (v===undefined||v===null||v==='') ? fallback : String(v); }
function setImg(id, url){
  const el = document.getElementById(id);
  if(!el) return;
  if(url){
    const fresh = bust(url);
    if(el.getAttribute('src') !== fresh){ el.src = fresh; }
    el.style.display = '';
  } else {
    el.removeAttribute('src');
    el.style.display = 'none';
  }
}
function formatDiscordDate(v){
  if(!v) return '—';
  const n = typeof v === 'number' ? (v < 10000000000 ? v*1000 : v) : Date.parse(v);
  return Number.isFinite(n) ? new Date(n).toLocaleDateString() : safeText(v);
}
function applyServerProfile(d, fallbackStatus, botProfile){
  d = d || {}; fallbackStatus = fallbackStatus || {}; botProfile = botProfile || {};
  const guild = firstDefined(d.guild, d.server, d) || {};
  const bot = firstDefined(d.bot, botProfile) || {};
  const icon = bust(firstDefined(guild.icon_url, guild.icon, guild.avatar_url));
  const banner = bust(firstDefined(guild.banner_url, guild.banner));
  const botAvatar = bust(firstDefined(bot.avatar_url, bot.avatar, botProfile.avatar));
  const botBanner = bust(firstDefined(bot.banner_url, bot.banner, botProfile.banner));
  setImg('server-icon', icon);
  const sb = document.getElementById('server-banner');
  if(sb){
    if(banner){
      const bg = `url("${banner}")`;
      if(sb.style.backgroundImage !== bg){ sb.style.backgroundImage = bg; }
      sb.classList.add('has-image');
    } else {
      sb.style.backgroundImage = ''; sb.classList.remove('has-image');
    }
  }
  document.getElementById('server-name').textContent = safeText(firstDefined(guild.name, d.name), 'Your server');
  const gid = firstDefined(guild.id, d.guild_id, d.id);
  document.getElementById('server-id').textContent = gid ? 'ID ' + gid : '—';
  document.getElementById('server-members').textContent = safeText(firstDefined(guild.member_count, guild.members, d.members, fallbackStatus.members), 0);
  document.getElementById('server-channels').textContent = safeText(firstDefined(guild.channel_count, guild.channels, d.channels, fallbackStatus.channels), 0);
  document.getElementById('server-roles').textContent = safeText(firstDefined(guild.role_count, guild.roles, d.roles, fallbackStatus.roles), 0);
  document.getElementById('server-hubs').textContent = safeText(firstDefined(guild.active_voice, guild.hubs, d.hubs, fallbackStatus.hubs), 0);
  document.getElementById('server-owner').textContent = safeText(firstDefined(guild.owner_name, guild.owner?.name, guild.owner_id, d.owner_name));
  document.getElementById('server-created').textContent = formatDiscordDate(firstDefined(guild.created_at, d.created_at));

/* ═══ HEARTBEAT ═══ */
let pulseRAF = null;
function startPulse(){
  const cv = document.getElementById('hero-pulse');
  if(!cv || reduceMotion || pulseRAF) return;
  const ctx = cv.getContext('2d'); let phase = 0;
  function resize(){ const dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = cv.offsetWidth * dpr; cv.height = cv.offsetHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  resize(); window.addEventListener('resize', resize);
  function frame(){
    pulseRAF = requestAnimationFrame(frame);
    if(document.hidden) return;
    const w = cv.offsetWidth, h = cv.offsetHeight; if(!w || !h) return;
    ctx.clearRect(0,0,w,h);
    const healthy = lastPing < 220;
    const stroke = healthy ? cssVar('--mint') : cssVar('--amber');
    phase += healthy ? 0.022 : 0.012;
    ctx.beginPath();
    for(let x = 0; x <= w; x += 3){
      const t = x / w * 9 + phase * 6;
      const beat = Math.exp(-Math.pow(((t % 9) - 4.2), 2) * 5) * 22;
      const y = h*0.62 - Math.sin(t*1.5)*3.2 - beat;
      x === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.strokeStyle = stroke; ctx.lineWidth = 1.6; ctx.globalAlpha = .75; ctx.stroke();
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.globalAlpha = 1;
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, withAlpha(stroke, .16)); grad.addColorStop(1, withAlpha(stroke, 0));
    ctx.fillStyle = grad; ctx.fill();
  }
  frame();
}

const _wsProfileCache = new Map();
async function wsResolveMany(ids){
  const out = {}; const now = Date.now(); const toFetch = [];
  for(const id of ids){
    const hit = _wsProfileCache.get(id);
    if(hit && (now - hit.ts) < 60000){ out[id] = hit.user; }
    else toFetch.push(id);
  }
  await Promise.all(toFetch.map(async id=>{
    try{
      const r = await apiFetch('/api/discord-profile?id=' + encodeURIComponent(id), { headers: hdr() });
      const d = await r.json().catch(()=>({}));
      if(r.ok && d.user){ out[id] = d.user; _wsProfileCache.set(id, { user: d.user, ts: Date.now() }); }
    }catch(e){}
  }));
  return out;
}
async function loadLogs(){
  const el = document.getElementById('logs-list'); if(!el) return;
  try{
    const r = await fetchApi('/api/logs',{headers:hdr()});
    if(!r.ok){ el.innerHTML = '<div class="empty-state"><strong>Activity would not load</strong>The bot did not answer. Try refresh.</div>'; return; }
    const d = await r.json();
    const logs = d.logs || [];
    if(!logs.length){ el.innerHTML = '<div class="empty-state"><strong>Nothing yet</strong>Actions the bot takes show up here.</div>'; return; }
    const missingIds = new Set();
    logs.forEach(l=>{
      const u = l.details?.user; if(u && u.id) return;
      const raw = l.details?.member_id || l.details?.user_id || l.details?.author_id || l.details?.target_id || l.details?.discord_id;
      if(raw && String(raw).length >= 15) missingIds.add(String(raw));
    });
    const resolved = await wsResolveMany([...missingIds]);
    el.innerHTML = logs.map(l=>{
      const ts = new Date(l.time * 1000);
      const kind = (l.kind || 'event').toLowerCase();
      const time = ts.toLocaleTimeString();
      let user = l.details?.user || null;
      if(!user){
        const raw = l.details?.member_id || l.details?.user_id || l.details?.author_id || l.details?.target_id || l.details?.discord_id;
        if(raw && resolved[String(raw)]) user = resolved[String(raw)];

      }
      const avatar = user ? (user.avatar ? `<img class="log-av" src="${esc(bust(user.avatar))}" alt="" onerror="this.style.display='none'">` : `<span class="log-av log-av-fallback">${esc((user.display_name || user.name || '?').slice(0,1).toUpperCase())}</span>`) : `<span class="log-av log-av-empty"></span>`;

      const hasDetails = l.details && Object.keys(l.details).filter(k => k !== 'user').length;
      const details = hasDetails ? `<details class="log-details"><summary>Details</summary><pre>${esc(JSON.stringify(Object.fromEntries(Object.entries(l.details).filter(([k]) => k !== 'user')), null, 2))}</pre></details>` : '';
      return `<div class="log-item"><div class="log-av-wrap">${avatar}</div><div class="log-time">${time}</div><div class="log-kind ${esc(kind)}">${esc(l.kind||'event')}</div><div class="log-text">${userLine ? `<div class="log-who">${userLine}</div>` : ''}${esc(l.text||'')}${details}</div></div>`;
    }).join('');

function wsBanDate(v){ if(!v) return '—'; const d=new Date(v); return Number.isNaN(d.getTime())?String(v):d.toLocaleString(); }
function wsDiscordId(b){ const raw=wsBanIdentifier(b,'discord'); const m=raw.match(/(\d{15,25})/); return m?m[1]:''; }
function wsFiveMId(b){ const raw=wsBanIdentifier(b,'fivem'); return raw.replace(/^fivem:/i,''); }
function normalizeWsBan(raw){
  if(!raw || typeof raw !== 'object') return null;
  const pick = (...keys) => { for(const k of keys){ const v = raw[k]; if(v !== undefined && v !== null && v !== '') return v; } return undefined; };
  let identifiers = [];
  const rawIds = pick('identifiers','ids','identifiants');
  if(Array.isArray(rawIds)){
    identifiers = rawIds.map(x => {
      if(x && typeof x === 'object') return { type: String(x.type||x.key||''), value: String(x.value||x.val||'') };
      return { type:'ID', value:String(x) };
    });
  } else if(rawIds && typeof rawIds === 'object'){ identifiers = Object.entries(rawIds).map(([type,value]) => ({ type, value:String(value) })); }
  return {
    banId: String(pick('banId','id','ban_id') ?? ''),
    reason: String(pick('reason','banReason','ban_reason') ?? 'No reason'),
    details: pick('details','meta','metadata') || {},
    evidenceUrl: pick('evidenceUrl','evidence_url','evidence') || null,
    bannedAt: pick('bannedAt','banned_at','createdAt','created_at','timestamp') || null,
    expiresAt: pick('expiresAt','expires_at','expires') || null,
    bannedBy: pick('bannedBy','banned_by','admin','adminId') || null,
    playerName: String(pick('playerName','player_name','player','name','username') ?? 'Unknown'),
    playerId: String(pick('playerId','player_id','playerUuid','player_uuid') ?? ''),
    playerLicense: String(pick('playerLicense','player_license','license') ?? ''),
    identifiers
  };
}
async function fetchWsPage(page, apiKey, apiBase){
  const url = new URL(apiBase + '/v1/bans/search');
  url.searchParams.set('limit', String(WS_PAGE_SIZE));
  url.searchParams.set('page', String(page));
  url.searchParams.set('serverId', WS_SERVER_ID);
  url.searchParams.set('reason', ''); url.searchParams.set('playerName', '');
  const r = await fetch(url.toString(), { headers: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + apiKey, 'X-API-Key': apiKey }, cache: 'no-store' });
  if(!r.ok){ let msg = 'HTTP ' + r.status; try{ const j = await r.json(); if(j?.message || j?.error) msg = j.message || j.error; }catch(e){} throw new Error(msg); }
  return r.json();
}
async function fetchAllWaveShieldBans(){
  const apiKey = getWsApiKey(); if(!apiKey) return { ok:false, error:'No API key configured' };
  const apiBase = getWsApiBase(); const all = []; let page = 1; let totalReported = 0;
  try{
    while(page <= WS_MAX_PAGES){
      const data = await fetchWsPage(page, apiKey, apiBase);
      let batch = [], total = 0, totalPages = 0;
      if(Array.isArray(data)){ batch = data; total = data.length; }
      else if(data && typeof data === 'object'){
        if(Array.isArray(data.bans)) batch = data.bans;
        else if(Array.isArray(data.data)) batch = data.data;
        else if(Array.isArray(data.results)) batch = data.results;
        else if(Array.isArray(data.items)) batch = data.items;
        else if(Array.isArray(data.bannedUsers)) batch = data.bannedUsers;
        total = Number(data.total || data.count || data.totalCount || 0) || 0;
        totalPages = Number(data.totalPages || data.pages || data.pageCount || 0) || 0;
      }
      if(!batch.length) break;
      all.push(...batch.map(normalizeWsBan).filter(Boolean));
      if(total) totalReported = total;
      if(totalPages && page >= totalPages) break;
      if(!totalPages && batch.length < WS_PAGE_SIZE) break;
      if(!totalPages && total && all.length >= total) break;
      page++;
    }
    return { ok:true, bans: all, total: totalReported || all.length, pages: page };
  }catch(e){ return { ok:false, error: e.message || 'Sync failed' }; }
}
async function syncWaveShieldBans(opts = {}){
  const silent = !!opts.silent;
  const statusEl = document.getElementById('ws-sync-status');
  const logEl = document.getElementById('ws-sync-log');
  const btn = document.getElementById('ws-sync-btn');
  if(statusEl) statusEl.textContent = 'Syncing…';
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  const result = await fetchAllWaveShieldBans();
  if(!result.ok){
    if(statusEl) statusEl.innerHTML = '<span style="color:var(--rose)">● Sync failed</span>';
    if(logEl) logEl.innerHTML = '<span style="color:var(--rose)">✕ ' + esc(result.error) + ' · ' + new Date().toLocaleTimeString() + '</span>';
    if(btn){ btn.disabled = false; btn.textContent = '↻ Sync now'; }
    if(!silent) toast('Sync failed: ' + result.error, false);
    return false;
  }
  WAVESHIELD_IMPORTED_BANS = result.bans;
  saveCachedBans(result.bans);
  const sel = document.getElementById('waveshield-ban-reason');
  if(sel){ while(sel.options.length > 1) sel.remove(1); }
  renderWaveShieldBans();
  if(statusEl) statusEl.innerHTML = '<span style="color:var(--mint)">● Synced</span>';
  if(logEl) logEl.innerHTML = '<span style="color:var(--mint)">● ' + result.bans.length + ' bans loaded</span>' + ' · ' + result.pages + ' page(s) · ' + new Date().toLocaleTimeString();
  if(btn){ btn.disabled = false; btn.textContent = '↻ Sync now'; }
  if(!silent) toast('Synced ' + result.bans.length + ' bans');
  return true;
}

/* ═══ ALT DETECTION ═══ */
const WS_ALT_MIN_LEN = 4;
let WS_ALT_INDEX_CACHE = null;
function wsHarvestIdentifiers(obj, depth = 0){
  const out = [];
  if(depth > 3 || obj === null || obj === undefined) return out;
  if(Array.isArray(obj)){
    for(const item of obj){
      if(item && typeof item === 'object' && ('value' in item || 'val' in item)){
        out.push({ type: String(item.type ?? item.key ?? item.name ?? 'id').trim(), value: String(item.value ?? item.val ?? '').trim() });
      } else { out.push(...wsHarvestIdentifiers(item, depth + 1)); }
    }
    return out;
  }
  if(typeof obj !== 'object') return out;
  for(const [k, v] of Object.entries(obj)){
    if(v === null || v === undefined || v === '') continue;
    const key = k.toLowerCase();
    const looksLikeId = key.includes('id') || key.includes('license') || key.includes('licence') || key.includes('steam') || key.includes('xbox') || key.includes('live') || key.includes('discord') || key.includes('fivem') || key.includes('serial') || key.includes('hwid') || key.includes('ip') || key.includes('token') || key.includes('identifier') || key.includes('uuid') || key.includes('guid');
    if(looksLikeId && (typeof v === 'string' || typeof v === 'number')){ out.push({ type: k, value: String(v).trim() }); }
    else if(looksLikeId && Array.isArray(v)){ out.push(...wsHarvestIdentifiers(v, depth + 1)); }
    else if(typeof v === 'object'){ out.push(...wsHarvestIdentifiers(v, depth + 1)); }
  }
  return out;
}
function wsNormalizeId(raw){
  if(raw === undefined || raw === null) return '';
  let v = String(raw).trim().toLowerCase();
  v = v.replace(/^(discord|fivem|license\d?|licence\d?|steam|xbox|live|playerid|player|ip|hwid|serial)\s*[:=]\s*/i, '');
  return v;
}
function wsIdentityKeys(ban){
  const keys = new Set();
  const add = (kind, raw) => { const v = wsNormalizeId(raw); if(v.length < WS_ALT_MIN_LEN) return; keys.add(String(kind).toLowerCase() + ':' + v); };
  if(Array.isArray(ban.identifiers)){ for(const id of ban.identifiers){ if(!id) continue; if(typeof id === 'object'){ add(id.type || id.key || id.name || 'id', id.value ?? id.val ?? ''); } else { add('id', id); } } }
  if(ban.playerLicense) add('license', ban.playerLicense);
  if(ban.playerId) add('playerid', ban.playerId);
  if(ban.details && typeof ban.details === 'object'){ for(const pair of wsHarvestIdentifiers(ban.details)) add(pair.type, pair.value); }
  return keys;
}
function wsBuildAltIndex(){
  const byKey = new Map();
  WAVESHIELD_IMPORTED_BANS.forEach((ban, i) => { for(const key of wsIdentityKeys(ban)){ if(!byKey.has(key)) byKey.set(key, []); byKey.get(key).push(i); } });
  const index = new Map();
  byKey.forEach((banIdxs, key) => {
    if(banIdxs.length < 2) return;
    for(const a of banIdxs){ for(const b of banIdxs){ if(a === b) continue; if(!index.has(a)) index.set(a, new Map()); const inner = index.get(a); if(!inner.has(b)) inner.set(b, new Set()); inner.get(b).add(key); } }
  });
  return index;
}
function wsAltIndex(){ if(!WS_ALT_INDEX_CACHE) WS_ALT_INDEX_CACHE = wsBuildAltIndex(); return WS_ALT_INDEX_CACHE; }
function wsLinkedFor(i){ return wsAltIndex().get(i) || null; }
function wsAltGroupCount(){
  const idx = wsAltIndex(); const seen = new Set(); let groups = 0;
  idx.forEach((_links, i) => {
    if(seen.has(i)) return;
    const stack = [i], comp = new Set();
    while(stack.length){ const cur = stack.pop(); if(comp.has(cur)) continue; comp.add(cur); const links = idx.get(cur); if(links) links.forEach((_k, j) => { if(!comp.has(j)) stack.push(j); }); }
    comp.forEach(x => seen.add(x)); if(comp.size >= 2) groups++;
  });
  return groups;
}
function wsShortKey(key){
  const colon = key.indexOf(':'); const kind = colon >= 0 ? key.slice(0, colon) : 'id'; const val = colon >= 0 ? key.slice(colon + 1) : key;
  const short = val.length > 22 ? (val.slice(0, 10) + '…' + val.slice(-7)) : val;
  return `${kind.toUpperCase()}=${short}`;
}
function wsAltPanelHtml(i){
  const links = wsLinkedFor(i); if(!links || !links.size) return '';
  const items = [...links.entries()].map(([j, sharedKeys]) => {
    const other = WAVESHIELD_IMPORTED_BANS[j]; if(!other) return '';
    const letter = (other.playerName || '?').slice(0, 1).toUpperCase();
    const sharedArr = [...sharedKeys]; const sharedTxt = sharedArr.slice(0, 3).map(wsShortKey).join('  ·  ');
    const extra = sharedArr.length > 3 ? `  +${sharedArr.length - 3} more` : '';
    const disc = wsDiscordId(other);
    const linkIcon = disc ? `<a class="btn btn-secondary btn-sm" style="padding:3px 7px;font-size:10px;" href="https://discord.com/users/${encodeURIComponent(disc)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">↗</a>` : '';
    return `<div class="ws-alt-item" onclick="wsJumpToBan(${j})"><div class="ws-ban-avatar">${esc(letter)}</div><div class="who"><div style="color:var(--text);font-weight:700;">${esc(other.playerName || 'Unknown user')} <span style="color:var(--text-3);font-weight:400;">· #${esc(other.banId || j)}</span></div><div class="why">shared ${esc(sharedTxt)}${extra}</div></div>${linkIcon}</div>`;
  }).join('');
  return `<div class="ws-alt-panel"><div class="ws-alt-panel-title">🔗 Linked accounts (${links.size})</div><div class="ws-alt-list">${items}</div></div>`;
}
function wsJumpToBan(i){

function renderWaveShieldBans(){

  const altIdx=wsAltIndex();

function handleWaveShieldImport(event){
  const file=event.target.files && event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('The JSON root must be an array of ban objects.');
      const ok = !WAVESHIELD_IMPORTED_BANS.length || confirm('Replace the '+WAVESHIELD_IMPORTED_BANS.length+' loaded bans with '+data.length+' imported bans?');
      if(!ok) return;
      WAVESHIELD_IMPORTED_BANS = data.map(normalizeWsBan).filter(Boolean);
      saveCachedBans(WAVESHIELD_IMPORTED_BANS);
      const sel=document.getElementById('waveshield-ban-reason'); if(sel){ while(sel.options.length>1) sel.remove(1); }
      renderWaveShieldBans(); toast('Imported '+data.length+' bans');
    }catch(err){ toast('Import failed: '+(err.message||'invalid JSON'), false); }
  };
  reader.onerror=()=>toast('Could not read that file', false);
  reader.readAsText(file);
}

/* ═══ IP GUARD ═══ */
let IP_GUARD_LOGS = [];
let IP_GUARD_BANS = {};
let DISCORD_BANS = {};

async function loadIpGuard(){
  if(!isOwner()) return;
  try{
    const r = await fetchApi('/api/ip-logs', { headers: hdr() });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || 'Could not load IP logs');
    IP_GUARD_LOGS = Array.isArray(d.logs) ? d.logs : [];
    IP_GUARD_BANS = d.bans || {};
    renderIpGuard();
  }catch(e){ toast(e.message || 'IP logs unavailable', false); }
}
function renderIpGuard(){
  const stats=document.getElementById('ipguard-stats');
  if(stats){
    const total=IP_GUARD_LOGS.length;
    const ok=IP_GUARD_LOGS.filter(l=>l.ok).length;
    const fail=IP_GUARD_LOGS.filter(l=>!l.ok).length;
    const ips=new Set(IP_GUARD_LOGS.map(l=>l.ip).filter(Boolean));
    const bans=Object.keys(IP_GUARD_BANS).length;
    const idBans=Object.keys(DISCORD_BANS).length;
    stats.innerHTML=`<span class="status-chip">${total} events</span><span class="status-chip live">${ok} successful</span><span class="status-chip" style="color:var(--rose);border-color:rgba(244,63,94,.35);">${fail} failed</span><span class="status-chip">${ips.size} unique IPs</span><span class="status-chip" style="color:var(--rose);border-color:rgba(244,63,94,.35);">🚫 ${bans} banned IPs</span><span class="status-chip" style="color:var(--rose);border-color:rgba(244,63,94,.35);">🚫 ${idBans} banned IDs</span>`;
  }
  renderIpLogs(); renderIpBans(); renderDiscordBans();
}
function renderIpLogs(){
  const list=document.getElementById('ipguard-log-list'); if(!list) return;
  const q=(document.getElementById('ipguard-search')?.value||'').trim().toLowerCase();
  const status=document.getElementById('ipguard-status')?.value||'';
  const kind=document.getElementById('ipguard-kind')?.value||'';
  const bannedOnly=!!document.getElementById('ipguard-banned-only')?.checked;
  const rows=IP_GUARD_LOGS.filter(l=>{
    if(status==='ok' && !l.ok) return false;
    if(status==='fail' && l.ok) return false;
    if(kind && (l.kind||'login')!==kind) return false;
    if(bannedOnly && !IP_GUARD_BANS[l.ip]) return false;
    if(q){ const hay=(String(l.ip||'')+' '+String(l.name||'')+' '+String(l.user_id||'')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(!rows.length){ list.innerHTML='<div class="empty-state"><strong>No matching events</strong>Try a different filter, or refresh.</div>'; return; }
  list.innerHTML=rows.map(l=>{
    const isBanned=!!IP_GUARD_BANS[l.ip];
    const isIdBan=(l.kind||'')==='id-ban-attempt';
    const when=new Date((l.time||0)*1000);
    const relTime=l.time?`${when.toLocaleTimeString()} · ${fmtRel(l.time)}`:'—';
    const letter=(l.display_name||l.name||l.user_id||'?').toString().slice(0,1).toUpperCase();
    const avatar=l.avatar?`<img class="ip-av" src="${esc(bust(l.avatar))}" alt="" onerror="this.style.display='none'; this.parentNode.textContent='${esc(letter)}'">`:`<div class="ip-av">${esc(letter)}</div>`;
    const userLink=l.user_id?`<a href="https://discord.com/users/${encodeURIComponent(l.user_id)}" target="_blank" rel="noopener noreferrer" class="log-user" style="border:0;padding:0;">${esc(l.display_name||l.name||l.user_id)}</a>`:`<span style="color:var(--text-3);">Unknown</span>`;
    let kindChip;
    if(isIdBan){ kindChip=`<span class="kind-chip" style="background:rgba(244,63,94,.22);color:#fda4af;">🚫 banned ID tried</span>`; }
    else if(l.ok){ kindChip=`<span class="kind-chip ${esc(l.kind||'login')}">${esc(l.kind||'login')}</span>`; }
    else{ kindChip=`<span class="kind-chip fail">failed</span>`; }
    const banBtn=isBanned?`<button class="btn btn-secondary btn-sm" onclick="removeIpBan('${esc(l.ip)}')">Unban IP</button>`:`<button class="btn btn-danger btn-sm" onclick="quickBanIp('${esc(l.ip)}')">🚫 Ban IP</button>`;
    const extraStyle=isIdBan?'border-color:rgba(244,63,94,.5); background:rgba(244,63,94,.10);':'';
    return `<div class="ip-row ${l.ok?'':'fail'} ${isBanned?'blocked':''}" style="${extraStyle}">${avatar}<div class="who"><div class="nm">${userLink}</div><div class="sub">${l.user_id?'ID '+esc(l.user_id):'no session user'}</div></div><span class="ip-addr ${isBanned?'banned':''}">${esc(l.ip||'unknown')}</span><span class="when">${esc(relTime)}</span>${kindChip}<div class="actions">${banBtn}</div></div>`;
  }).join('');
}
function renderIpBans(){
  const el=document.getElementById('ipguard-ban-list'); if(!el) return;
  const entries=Object.entries(IP_GUARD_BANS);
  if(!entries.length){ el.innerHTML='<div class="muted" style="font-size:12px;">No IPs are banned.</div>'; return; }
  el.innerHTML=entries.sort((a,b)=>(b[1]?.added_at||0)-(a[1]?.added_at||0)).map(([ip,meta])=>`<div class="ip-ban-item"><code>${esc(ip)}</code><span class="why">${esc(meta?.reason||'—')} · ${fmtRel(meta?.added_at||0)}</span><button class="btn btn-secondary btn-sm" onclick="removeIpBan('${esc(ip)}')">Unban</button></div>`).join('');
}

function wsProofForUser(discordId){
  if(!discordId) return '';
  const idStr=String(discordId).trim(); if(!/^\d{15,25}$/.test(idStr)) return '';
  const matches=[];
  WAVESHIELD_IMPORTED_BANS.forEach((b,idx)=>{ const disc=wsDiscordId(b); if(disc && disc===idStr) matches.push({ban:b,idx}); });
  if(!matches.length){ return `<div class="ws-proof ws-proof-clean"><div class="ws-proof-head">🟢 WaveShield status — CLEAN</div><div class="muted" style="font-size:12px;">No matching ban found for Discord ID <code class="mono">${esc(idStr)}</code>.</div></div>`; }
  const rowsHtml=matches.map(({ban,idx})=>{
    const banDate=wsBanDate(ban.bannedAt);
    const evidence=ban.evidenceUrl?`<a class="btn btn-secondary btn-sm" style="margin-top:6px;" href="${esc(ban.evidenceUrl)}" target="_blank" rel="noopener noreferrer">↗ View evidence</a>`:'<span class="muted" style="font-size:11px;">No evidence URL stored</span>';
    const shared=[...wsIdentityKeys(ban)].slice(0,4).map(wsShortKey).join('  ·  ');
    return `<div class="ws-proof-row" onclick="wsJumpToBan(${idx})"><div class="ws-proof-title">Ban #${esc(ban.banId||idx)} — ${esc(ban.reason||'No reason')}</div><div class="ws-proof-meta">Banned ${esc(banDate)} · By ${esc(ban.bannedBy||'—')}</div><div class="ws-proof-ids">Matched: ${esc(shared||'discord ID')}</div>${evidence}</div>`;
  }).join('');
  return `<div class="ws-proof ws-proof-flagged"><div class="ws-proof-head">🔴 WaveShield status — BANNED (${matches.length} match${matches.length===1?'':'es'})</div><div class="ws-proof-list">${rowsHtml}</div></div>`;
}

    const qs=new URLSearchParams({user:query});

  }catch(e){
    const msg=String(e?.message||'');
    if(msg.includes('offline')||msg.includes('did not respond')) toast('Bot is offline — cannot scan servers right now.', false);

  }finally{ if(btn){ btn.disabled=false; btn.textContent='⌘ Scan all supplied servers'; } }

/* ═══ NAVIGATION ═══ */
function nav(page){
  if(USER && !canOpen(page)){ toast('That page is owner only', false); return; }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelector('.nav-item[data-page="'+page+'"]')?.classList.add('active');
  document.getElementById('topbar-title').textContent=PAGE_NAMES[page] || 'Dashboard';
  document.getElementById('topbar-sub').textContent=PAGE_SUBS[page] || '';
  document.getElementById('content').scrollTop=0; toggleSidebar(false);
  [statusTimer,logsTimer,auditTimer].forEach(t=>{ if(t) clearInterval(t); });
  statusTimer=logsTimer=auditTimer=null;
  if(page==='status'){ statusHist=[]; loadStatus(); statusTimer=setInterval(loadStatus, 5000); }
  if(page==='logs'){ loadLogs(); logsTimer=setInterval(loadLogs, 15000); }
  if(page==='audit'){ loadAudit(); auditTimer=setInterval(loadAudit, 15000); }
  if(page==='whitelist') loadWhitelist();
  if(page==='overview') loadAnalytics();
  if(page==='ai') loadAiPanel();
  if(page==='userlookup'){ useConfiguredGuild(); loadScanBlacklist(); }
  if(page==='staff') loadStaff();
  if(page==='welcome') welcomeSyncButtons();
  if(page==='ipguard'){ loadIpGuard(); loadDiscordBans(); }
  syncEverything();
}
function refreshAll(){
  loadConfig();
  if(isOwner()){ loadProfile(); loadLiveServer(); loadProCenter(); loadAnalytics(); }
  const p=document.querySelector('.page.active')?.id;
  if(p==='page-status') loadStatus();
  if(p==='page-logs') loadLogs();
  if(p==='page-audit') loadAudit();
  if(p==='page-whitelist') loadWhitelist();
  if(p==='page-ai') loadAiPanel();
  if(p==='page-welcome') welcomeSyncButtons();
  if(p==='page-ipguard'){ loadIpGuard(); loadDiscordBans(); }
}

/* ═══ SAVING ═══ */
function markDirty(){ dirty=true; document.getElementById('save-bar').classList.add('visible'); }
function discardChanges(){ dirty=false; document.getElementById('save-bar').classList.remove('visible'); loadConfig(); toast('Changes discarded'); }
async function saveAll(){
  const payload={};
  document.querySelectorAll('[data-key]').forEach(el=>{
    const k=el.dataset.key;
    if(el.type==='checkbox') payload[k]=el.checked;
    else if(el.type==='number') payload[k]=Number(el.value);
    else payload[k]=el.value;
  });
  const tw=document.getElementById('ai-trigger-words'); if(tw){ const raw=tw.value.trim(); payload.ai_trigger_words=raw?raw.split(',').map(s=>s.trim()).filter(Boolean):[]; }
  const ci=document.getElementById('ai-channel-ids'); if(ci){ const raw=ci.value.trim(); payload.ai_channel_ids=raw?raw.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>Number.isFinite(n)):[]; }
  const btnTa=document.getElementById('welcome-buttons-json');
  if(btnTa){
    try{ const raw=(btnTa.value||'').trim(); payload.welcome_buttons=raw?JSON.parse(raw):[]; if(!Array.isArray(payload.welcome_buttons)) payload.welcome_buttons=[]; }
    catch(e){ toast('Welcome buttons JSON is invalid — using previous value', false); delete payload.welcome_buttons; }
  }
  try{
    const r=await fetchApi('/api/config',{method:'POST',headers:hdr(),body:JSON.stringify(payload)});
    if(!r.ok){ toast('The bot refused the save', false); return; }
    dirty=false; document.getElementById('save-bar').classList.remove('visible'); toast('Changes saved');
  }catch(e){ toast('The save did not go through', false); }
}

/* ═══ ACTIONS ═══ */
async function post(path, body){
  try{
    const r=await fetchApi(path,{method:'POST',headers:hdr(),body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ toast(d.error || 'That did not work', false); return null; }
    return d;
  }catch(e){ toast('The bot is offline.', false); return null; }
}

/* ═══ ACCESS CONTROL ═══ */
const ACCESS_CATEGORIES={
  'Server operations':['messaging','moderation','channels','roles','admin','whitelist'],
  'Protection':['antinuke','scam','verify','hub','backup'],
  'Automation & AI':['ai','music','status-cfg','presence','welcome'],
  'Intelligence':['userlookup','waveshield']
};
function selectedPermCount(){return Object.values(newPerms).filter(Boolean).length;}
function renderPermGrid(){
  const g=document.getElementById('perm-grid'); if(!g) return; g.innerHTML='';
  Object.entries(ACCESS_CATEGORIES).forEach(([cat,pages])=>{
    const box=document.createElement('div'); box.className='perm-category';
    box.innerHTML=`<div class="perm-category-head"><span class="perm-category-title">${esc(cat)}</span><span class="perm-category-count" data-cat-count="${esc(cat)}"></span></div><div class="perm-category-items"></div>`;
    const items=box.querySelector('.perm-category-items');
    pages.forEach(p=>{
      const b=document.createElement('div');
      b.className='perm-btn'+(newPerms[p]?' on':''); b.textContent=PAGE_NAMES[p]||p;
      b.onclick=()=>{ newPerms[p]=!newPerms[p]; b.classList.toggle('on'); updatePermCount(); };
      items.appendChild(b);
    });
    g.appendChild(box);
  });
  updatePermCount();
}
function updatePermCount(){
  const n=selectedPermCount(); const el=document.getElementById('perm-count'); if(el) el.textContent=n+' selected';
  document.querySelectorAll('[data-cat-count]').forEach(el=>{ const cat=el.dataset.catCount, ps=ACCESS_CATEGORIES[cat]||[]; el.textContent=ps.filter(p=>newPerms[p]).length+'/'+ps.length; });
}
function selectAllPerms(){ PAGES.forEach(p=>newPerms[p]=true); renderPermGrid(); }
function clearAllPerms(){ newPerms={}; renderPermGrid(); }
function applyAccessPreset(p){
  newPerms={};
  if(p==='viewer')['status','logs'].forEach(x=>newPerms[x]=true);
  if(p==='moderator')['status','logs','audit','moderation','whitelist','userlookup','waveshield'].forEach(x=>newPerms[x]=true);
  if(p==='manager') PAGES.forEach(x=>newPerms[x]=true);
  const full=document.getElementById('sf-full-control'), manage=document.getElementById('sf-manage-access');
  if(full) full.checked=p==='full'; if(manage) manage.checked=p==='full';
  renderPermGrid(); updateAccessControls();
}
function updateAccessControls(){
  const full=!!document.getElementById('sf-full-control')?.checked;
  const preset=document.getElementById('sf-preset');
  if(full) PAGES.forEach(p=>newPerms[p]=true);
  if(full && preset) preset.value='full';
  const warn=document.getElementById('access-warning');
  if(warn) warn.textContent=full?'Full Control grants every module plus access administration. Only the owner can assign or revoke this privilege.':'Manage Access lets an operator manage regular staff permissions. It does not allow them to grant Full Control or Access Management.';
  renderPermGrid();
}
async function loadStaff(){
  if(!USER || !(isOwner()||USER.full_control||USER.manage_access)) return;
  try{
    const r=await fetchApi('/api/staff',{headers:hdr()}), d=await r.json(), tb=document.getElementById('staff-rows');
    if(!tb) return;
    const list=d.staff||[], stats=document.getElementById('access-stats');
    if(stats){
      const full=list.filter(s=>s.full_control).length, mgr=list.filter(s=>s.manage_access).length;
      stats.innerHTML=`<div class="access-stat"><b>${list.length}</b><span>Operators</span></div><div class="access-stat"><b>${full}</b><span>Full Control</span></div><div class="access-stat"><b>${mgr}</b><span>Access Managers</span></div><div class="access-stat"><b>${list.reduce((a,s)=>a+Object.entries(s.perms||{}).filter(([k,v])=>v&&k!=='*').length,0)}</b><span>Granted modules</span></div>`;
    }
    if(!list.length){ tb.innerHTML='<tr><td colspan="5"><div class="empty-state"><strong>No operators yet</strong>Create the first operator above.</div></td></tr>'; return; }
    tb.innerHTML=list.map(s=>{
      const full=!!s.full_control, manager=!!s.manage_access;
      const role=full?'full':manager?'manager':'staff';
      const pages=Object.entries(s.perms||{}).filter(([k,v])=>v&&k!=='*').map(([k])=>PAGE_NAMES[k]||k);
      const modules=full?'All dashboard modules':(pages.length?pages.join(' · '):'No modules assigned');
      const delegation=full?'Full Control + Access Management':manager?'Can manage regular operators':'Module access only';
      const canEdit=isOwner()||USER.full_control||USER.manage_access;
      const buttons=canEdit?`<button class="btn btn-secondary btn-sm" onclick="editStaff('${esc(s.id)}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="removeStaff('${esc(s.id)}')">Remove</button>`:'<span class="muted" style="font-size:11px;">Protected</span>';
      return `<tr><td><div class="access-user"><strong>${esc(s.name)}</strong><small>${esc(s.id)}</small></div></td><td><span class="access-role ${role}">${full?'FULL CONTROL':manager?'ACCESS MANAGER':'STAFF'}</span></td><td><div class="access-modules">${esc(modules)}</div></td><td><div class="access-delegation">${esc(delegation)}</div></td><td style="white-space:nowrap">${buttons}</td></tr>`;
    }).join('');
  }catch(e){ toast('Could not load access directory', false); }
}
async function addStaff(){
  const id=val('sf-id'), name=val('sf-name'), pw=document.getElementById('sf-pw').value;
  const full=!!document.getElementById('sf-full-control')?.checked, manage=!!document.getElementById('sf-manage-access')?.checked;
  if(!id||!name||!pw){ toast('Fill in the Discord ID, name and password', false); return; }
  if((full||manage) && !isOwner()){ toast('Only the owner can delegate elevated access', false); return; }
  const r=await post('/api/staff/add',{discord_id:id,name,password:pw,perms:full?{'*':true}:newPerms,full_control:full,manage_access:manage});
  if(r){
    toast('Operator created');
    ['sf-id','sf-name','sf-pw'].forEach(i=>{ const e=document.getElementById(i); if(e) e.value=''; });
    newPerms={};
    document.getElementById('sf-full-control').checked=false;
    document.getElementById('sf-manage-access').checked=false;
    document.getElementById('sf-preset').value='custom';
    renderPermGrid(); loadStaff();
  }
}
async function editStaff(id){
  if(!isOwner()&&!USER.full_control&&!USER.manage_access){ toast('You do not have access-management permission', false); return; }
  const name=prompt('Operator name (leave blank to keep current):'); if(name===null) return;
  const password=prompt('New password (leave blank to keep current):'); if(password===null) return;
  const payload={discord_id:id};
  if(name.trim()) payload.name=name.trim();
  if(password) payload.password=password;
  if(isOwner()){
    payload.full_control=confirm('Grant Full Control? Cancel means Full Control will be disabled.');
    payload.manage_access=payload.full_control||confirm('Grant Access Management?');
  }
  const r=await post('/api/staff/update', payload);
  if(r){ toast('Operator updated'); loadStaff(); }
}
async function removeStaff(id){
  if(!confirm('Remove this operator? They will immediately lose dashboard access.')) return;
  const r=await post('/api/staff/remove',{discord_id:id});
  if(r){ toast('Operator removed'); loadStaff(); }
}

/* ═══ SIDEBAR + COMMAND PALETTE ═══ */
function toggleSidebar(open){
  document.getElementById('sidebar')?.classList.toggle('open', open);
  document.getElementById('mobile-overlay')?.classList.toggle('open', open);
}
function closeCommandPalette(){
  const p=document.getElementById('command-palette');
  p.classList.remove('open'); p.setAttribute('aria-hidden','true');
}
function openCommandPalette(){
  const p=document.getElementById('command-palette'), input=document.getElementById('command-input');
  p.classList.add('open'); p.setAttribute('aria-hidden','false');
  input.value=''; renderCommands(); requestAnimationFrame(()=>input.focus());
}
function renderCommands(query=''){
  const q=query.trim().toLowerCase();
  const list=document.getElementById('command-list');
  const items=[...document.querySelectorAll('.nav-item[data-page]')].filter(n=>!n.classList.contains('hidden'))
    .map(n=>({page:n.dataset.page, name:PAGE_NAMES[n.dataset.page]||n.dataset.page, icon:n.querySelector('.nav-ico')?.textContent||'•'}))
    .filter(x=>!q || x.name.toLowerCase().includes(q) || x.page.includes(q));
  list.innerHTML=items.length
    ? items.map((x,i)=>`<div class="command-item ${i===0?'selected':''}" data-page="${x.page}" tabindex="0"><span>${x.icon}</span><strong>${esc(x.name)}</strong><span class="command-key">${esc(x.page)}</span></div>`).join('')
    : '<div class="empty-state"><strong>No page by that name</strong>Try a different word.</div>';
  list.querySelectorAll('.command-item').forEach(item=>{
    item.onclick=()=>{ nav(item.dataset.page); closeCommandPalette(); };
    item.onkeydown=e=>{ if(e.key==='Enter'){ nav(item.dataset.page); closeCommandPalette(); } };
  });
}

/* ═══ GLOBAL AUTO-SYNC ENGINE ═══ */
const SYNC_INTERVAL_MS = 8000;
let globalSyncTimer = null;
let lastSyncAt = 0;
let syncInFlight = false;

function updateSyncIndicator(){
  const el = document.getElementById('sync-indicator');
  if(!el) return;
  el.classList.remove('stale','offline');
  if(!API_ONLINE){ el.classList.add('offline'); el.textContent = 'Bot offline'; return; }
  if(!lastSyncAt){ el.textContent = 'Syncing…'; return; }
  const age = Date.now() - lastSyncAt;
  if(age > 30000) el.classList.add('stale');
  el.textContent = 'Synced ' + new Date(lastSyncAt).toLocaleTimeString();
}

function activePageName(){
  return document.querySelector('.page.active')?.id.replace('page-','') || 'overview';
}

async function syncPage(page){
  try{
    switch(page){
      case 'overview':
        await Promise.all([
          loadLiveServer(),
          loadProCenter(),
          isOwner() ? loadProfile() : Promise.resolve(),
        ]);
        break;
      case 'status':         await loadStatus();                             break;
      case 'logs':           await loadLogs();                               break;
      case 'audit':          await loadAudit();                              break;
      case 'whitelist':      await loadWhitelist();                          break;
      case 'staff':          if(isOwner()||USER?.full_control||USER?.manage_access) await loadStaff(); break;
      case 'waveshield':     if(getWsApiKey()) await syncWaveShieldBans({silent:true}); break;
      case 'ipguard':        if(isOwner()) await Promise.all([loadIpGuard(), loadDiscordBans()]); break;
      case 'userlookup':     await loadScanBlacklist();                      break;
    }
  }catch(e){}
}

async function syncEverything(){
  if(syncInFlight || document.hidden) return;
  syncInFlight = true;
  try{
    const ok = await checkApiHealth(true);
    if(!ok){ updateSyncIndicator(); return; }
    await Promise.all([
      loadLiveServer(),
      isOwner() ? loadProfile() : Promise.resolve(),
    ]);
    await syncPage(activePageName());
    lastSyncAt = Date.now();
    updateSyncIndicator();
  }catch(e){
  }finally{
    syncInFlight = false;
  }
}

function startGlobalSync(){
  if(globalSyncTimer) clearInterval(globalSyncTimer);
  globalSyncTimer = setInterval(syncEverything, SYNC_INTERVAL_MS);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) syncEverything(); });
  window.addEventListener('focus', syncEverything);
  window.addEventListener('online', syncEverything);
  setInterval(() => { checkApiHealth(true); }, 20000);
}

/* ═══ BOOT ═══ */
window.addEventListener('load', async () => {
  renderPermGrid();
  syncChartTheme();
  renderCommands();

  document.querySelectorAll('table').forEach(t=>{
    if(t.parentElement.classList.contains('table-scroll')) return;
    const wrap=document.createElement('div'); wrap.className='table-scroll';
    t.parentNode.insertBefore(wrap, t); wrap.appendChild(t);
  });

  document.addEventListener('pointerdown', e=>{
    const btn=e.target.closest('.btn, .btn-login, .btn-oauth, .quick-grid button, #ban-user-btn');
    if(!btn || reduceMotion) return;
    const r=btn.getBoundingClientRect(); const d=document.createElement('span');
    d.className='ripple'; const size=Math.max(r.width, r.height);
    d.style.width=d.style.height=size+'px';
    d.style.left=(e.clientX-r.left-size/2)+'px';
    d.style.top=(e.clientY-r.top-size/2)+'px';
    btn.appendChild(d); setTimeout(()=>d.remove(), 560);
  });

  const cmdInput=document.getElementById('command-input');
  cmdInput.addEventListener('input', ()=>renderCommands(cmdInput.value));
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCommandPalette(); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='j'){ e.preventDefault(); toggleTheme(); }
    if(e.key==='Escape'){ closeCommandPalette(); toggleSidebar(false); closeBanModal(); }
    if(e.key==='Enter' && document.activeElement?.id==='in-pw') doLogin();
    if(!document.getElementById('command-palette').classList.contains('open')) return;
    const items=[...document.querySelectorAll('.command-item')];
    if(!items.length) return;
    let idx=items.findIndex(x=>x.classList.contains('selected'));
    if(e.key==='ArrowDown'){ e.preventDefault(); idx=(idx+1)%items.length; }
    else if(e.key==='ArrowUp'){ e.preventDefault(); idx=(idx-1+items.length)%items.length; }
    else if(e.key==='Enter' && idx>=0){ nav(items[idx].dataset.page); closeCommandPalette(); return; }
    else return;
    items.forEach(x=>x.classList.remove('selected'));
    items[idx].classList.add('selected');
  });

  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

  if(window.Chart){
    Chart.defaults.font.family="'Manrope', system-ui, sans-serif";
    Chart.defaults.font.size=11.5;
    Chart.defaults.animation.easing='easeOutQuart';
    Chart.defaults.plugins.tooltip.padding=11;
    Chart.defaults.plugins.tooltip.cornerRadius=9;
    Chart.defaults.plugins.tooltip.displayColors=true;
    syncChartTheme();
  }

  (function wireWaveShieldImport(){
    const input=document.getElementById('waveshield-import-input');
    if(input) input.addEventListener('change', handleWaveShieldImport);
  })();

  setApiState(false,'Checking…');
  checkApiHealth(true);
  initWaveShieldBans();
  startWaveShieldRefresh();
  startGlobalSync();
  updateSyncIndicator();

  const url=new URL(window.location.href);
  const code=url.searchParams.get('code');
  const oauthError=url.searchParams.get('error');
  if(code || oauthError){
    window.history.replaceState({}, document.title, url.pathname + url.hash);
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').classList.remove('visible');
    if(code) await handleOAuthCallback(code);
    else showAuthError('You cancelled the Discord authorization.');
    return;
  }

  let sess=null;
  try{ sess=localStorage.getItem('ftw_session'); }catch(e){}
  if(sess){
    SESSION=sess;
    fetchApi('/api/me',{headers:hdr()})
      .then(r=>{ if(!r.ok) throw 0; return r.json(); })
      .then(u=>{ USER=u; enterApp(); bootData(); if(isOwner()){ loadStaff(); } })
      .catch(()=>{ try{ localStorage.removeItem('ftw_session'); }catch(e){} });
  }
});

matchMedia('(prefers-color-scheme: light)').addEventListener('change', e=>{
  let saved=null;
  try{ saved=localStorage.getItem(THEME_KEY); }catch(err){}
  if(!saved) applyTheme(e.matches ? 'light' : 'dark', true);
});
</script>
