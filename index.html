<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#060C1A">
<title>FTW · Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='g' x1='6' y1='4' x2='42' y2='44' gradientUnits='userSpaceOnUse'><stop stop-color='%237BE9DD'/><stop offset='.55' stop-color='%234FD1C5'/><stop offset='1' stop-color='%2322A392'/></linearGradient></defs><path d='M24 3 42 12.6v20.8L24 43 6 33.4V12.6z' fill='url(%23g)'/><path d='M18.2 15h12.6v5.1h-7.7v4.2h6v4.9h-6V37h-4.9z' fill='%23051F1C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   1 · TOKENS
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#03080F;
  --bg:#060C1A;
  --bg-elev:#0A1224;
  --panel:#0D1730;
  --panel-2:#122040;
  --panel-3:#1A2B52;
  --line:rgba(158,232,222,.09);
  --line-2:rgba(158,232,222,.18);
  --line-3:rgba(158,232,222,.30);

  --text:#EDF6F4;
  --text-2:#9DB4BA;
  --text-3:#68838C;

  /* house colour — Purity teal */
  --iris:#4FD1C5;
  --iris-2:#7BE9DD;
  --iris-wash:rgba(79,209,197,.14);
  --iris-glow:rgba(79,209,197,.45);
  --iris-deep:#22A392;

  --mint:#5EE0A0;
  --mint-wash:rgba(94,224,160,.14);
  --amber:#F6C260;
  --amber-wash:rgba(246,194,96,.14);
  --rose:#FF6B8A;
  --rose-wash:rgba(255,107,138,.14);
  --violet:#8B6BFF;
  --violet-wash:rgba(139,107,255,.16);

  --on-accent:#04201D;
  --shadow-1:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(2,10,22,.40);
  --shadow-2:0 30px 80px rgba(2,8,18,.62);
  --shadow-glow:0 18px 46px -22px var(--iris-glow);
  --grid-line:rgba(158,232,222,.028);
  --sheen:rgba(255,255,255,.07);
  --scrim:rgba(3,8,18,.76);

  --r-lg:22px; --r-md:15px; --r-sm:11px; --r-xs:8px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --rail:264px;
}
:root[data-theme="light"]{
  --ink:#0C2B28;
  --bg:#EEF6F4;
  --bg-elev:#F7FBFA;
  --panel:#FFFFFF;
  --panel-2:#F2F8F7;
  --panel-3:#E3EFED;
  --line:rgba(12,43,40,.10);
  --line-2:rgba(12,43,40,.18);
  --line-3:rgba(12,43,40,.28);

  --text:#0F2E2B;
  --text-2:#486460;
  --text-3:#7C9793;

  --iris:#0B8276;
  --iris-2:#2FC7B8;
  --iris-wash:rgba(11,130,118,.10);
  --iris-glow:rgba(11,130,118,.32);
  --iris-deep:#076058;

  --mint:#1C7F4C;
  --mint-wash:rgba(28,127,76,.12);
  --amber:#B4760D;
  --amber-wash:rgba(180,118,13,.12);
  --rose:#D93A5E;
  --rose-wash:rgba(217,58,94,.12);
  --violet:#6440D8;
  --violet-wash:rgba(100,64,216,.12);

  --on-accent:#FFFFFF;
  --shadow-1:0 1px 2px rgba(12,43,40,.05),0 12px 30px rgba(12,43,40,.08);
  --shadow-2:0 28px 76px rgba(12,43,40,.18);
  --shadow-glow:0 18px 40px -22px rgba(11,130,118,.35);
  --grid-line:rgba(12,43,40,.03);
  --sheen:rgba(12,43,40,.045);
  --scrim:rgba(238,246,244,.74);
}

/* ═══════════════════════════════════════════════════════════
   2 · BASE
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;overflow:hidden;
  font-feature-settings:'tnum' 1,'ss01' 1;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background-color .5s var(--ease),color .3s var(--ease);
}
h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif;letter-spacing:-.02em}
.mono,code{font-family:'IBM Plex Mono',ui-monospace,monospace}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--iris);text-decoration:none}
img{max-width:100%}
::selection{background:var(--iris-wash);color:var(--text)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:padding-box}

:focus-visible{outline:2px solid var(--iris);outline-offset:2px;border-radius:6px}

/* ambient field */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1100px 680px at 6% -10%,var(--iris-wash),transparent 62%),
    radial-gradient(900px 600px at 104% 106%,var(--mint-wash),transparent 60%),
    radial-gradient(700px 500px at 60% 40%,rgba(139,107,255,.05),transparent 70%);
  transition:opacity .5s var(--ease);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.9;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:38px 38px;
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent 76%);
  mask-image:linear-gradient(to bottom,#000,transparent 76%);
}

html.theming *,html.theming *::before,html.theming *::after{
  transition:background-color .42s var(--ease),border-color .42s var(--ease),
             color .3s var(--ease),fill .3s var(--ease),box-shadow .42s var(--ease) !important;
}

/* ═══════════════════════════════════════════════════════════
   2b · BRAND / LOGO
   ═══════════════════════════════════════════════════════════ */
.brand-mark{
  position:relative;display:inline-grid;place-items:center;
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;
  background:linear-gradient(145deg,rgba(123,233,221,.16),rgba(34,163,146,.10));
  border:1px solid rgba(123,233,221,.22);
  box-shadow:0 8px 22px -12px var(--iris-glow), inset 0 1px 0 rgba(255,255,255,.10);
  transition:transform .4s var(--ease),box-shadow .3s var(--ease);
}
.brand-mark svg{width:24px;height:24px;display:block}
.brand-mark::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 55%);
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
}

.brand-lockup{display:flex;align-items:center;gap:11px;min-width:0}
.brand-lockup:hover .brand-mark{transform:translateY(-1px) scale(1.03);box-shadow:0 14px 30px -14px var(--iris-glow), inset 0 1px 0 rgba(255,255,255,.14)}
.brand-text{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand-name{
  font-family:'Sora',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(115deg,var(--iris-2),var(--iris-deep));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-tag{
  margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-3);
}

/* ═══════════════════════════════════════════════════════════
   3 · SIGN IN
   ═══════════════════════════════════════════════════════════ */
#auth-screen{
  position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;padding:24px;
  background:var(--bg);
}
#auth-screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(820px 520px at 50% -4%,var(--iris-wash),transparent 66%),
    radial-gradient(600px 400px at 92% 100%,var(--mint-wash),transparent 62%);
}
#auth-screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 34%,#000,transparent 72%);
  mask-image:radial-gradient(circle at 50% 34%,#000,transparent 72%);
}
.auth-logo{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.auth-mark{
  position:relative;display:grid;place-items:center;width:78px;height:78px;border-radius:24px;
  background:linear-gradient(150deg,rgba(123,233,221,.18),rgba(34,163,146,.08));
  border:1px solid rgba(123,233,221,.24);
  box-shadow:0 26px 60px -26px var(--iris-glow), inset 0 1px 0 rgba(255,255,255,.12);
  animation:markIn .7s var(--ease-out) both;
}
.auth-mark::before{
  content:"";position:absolute;inset:-26px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--iris-glow),transparent 68%);opacity:.35;
  animation:markGlow 4.5s ease-in-out infinite;
}
.auth-mark svg{width:46px;height:46px;display:block;position:relative;z-index:1}
@keyframes markIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
@keyframes markGlow{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.5;transform:scale(1.08)}}
.auth-wordmark{
  font-family:'Sora',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.045em;
  display:flex;align-items:baseline;gap:8px;
  background:linear-gradient(120deg,var(--iris-2),var(--iris-deep));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.auth-wordmark span{
  font-size:15px;font-weight:700;letter-spacing:.02em;-webkit-text-fill-color:var(--text-2);
  color:var(--text-2);
}
.auth-logo .sub{font-size:12.5px;color:var(--text-3);letter-spacing:.04em}
.auth-card{
  position:relative;width:min(430px,100%);padding:34px;display:flex;flex-direction:column;gap:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);
  animation:cardIn .5s var(--ease-out) both;
  overflow:hidden;
}
.auth-card::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.auth-card h2{font-size:20px;font-weight:700;text-align:center}
.auth-card p{font-size:13px;line-height:1.65;color:var(--text-2);text-align:center}
.auth-card b{color:var(--mint)}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea,.input-sm{
  width:100%;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--text);
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.field textarea,textarea.input-sm{resize:vertical;min-height:76px;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus,.input-sm:focus{
  border-color:var(--iris);box-shadow:0 0 0 4px var(--iris-wash);background:var(--panel)
}
.field input::placeholder,.input-sm::placeholder{color:var(--text-3)}

.btn-login{
  margin-top:4px;padding:13px 24px;font-size:14px;font-weight:700;font-family:'Sora',sans-serif;
  color:var(--on-accent);background:var(--iris);border:none;border-radius:var(--r-sm);cursor:pointer;
  transition:transform .18s var(--ease),box-shadow .25s,filter .2s;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow);filter:brightness(1.06)}
.btn-login:active{transform:translateY(0) scale(.99)}
.btn-login:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
.btn-oauth{
  margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px 24px;font-size:14px;font-weight:700;font-family:'Sora',sans-serif;
  color:#fff;background:#5865F2;border:none;border-radius:var(--r-sm);cursor:pointer;text-decoration:none;
  transition:transform .18s var(--ease),box-shadow .25s,filter .2s;
}
.btn-oauth:hover{transform:translateY(-1px);box-shadow:0 16px 30px -14px rgba(88,101,242,.85);filter:brightness(1.05);color:#fff}
.btn-oauth:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-oauth svg{width:20px;height:20px;flex-shrink:0}
#auth-error{display:none;font-size:13px;line-height:1.55;color:var(--rose);text-align:center}
.auth-theme{position:absolute;top:22px;right:22px;z-index:2}

/* ═══════════════════════════════════════════════════════════
   4 · SHELL
   ═══════════════════════════════════════════════════════════ */
#app{display:flex;width:100%;height:100vh;opacity:0;transition:opacity .35s var(--ease)}
#app.visible{opacity:1}

#sidebar{
  width:var(--rail);min-width:var(--rail);height:100vh;overflow-y:auto;z-index:20;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg-elev),color-mix(in srgb,var(--bg-elev) 88%,#000 12%));
  border-right:1px solid var(--line);
  transition:transform .4s var(--ease);
}
.sidebar-header{
  position:sticky;top:0;z-index:2;padding:20px 18px 16px;
  background:var(--bg-elev);border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.sidebar-status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--text-2);
  padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px var(--mint-wash)}
.sidebar-status .dot{animation:breathe 2.6s var(--ease) infinite;flex:0 0 7px}
.sidebar-status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes breathe{0%,100%{box-shadow:0 0 0 4px var(--mint-wash)}50%{box-shadow:0 0 0 8px transparent}}

.nav-section{padding:20px 20px 8px;font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;margin:2px 10px;padding:8px 11px;
  font-size:13.5px;font-weight:500;color:var(--text-2);border-radius:11px;cursor:pointer;user-select:none;
  transition:color .18s,background .18s,transform .22s var(--ease);
}
.nav-item .nav-ico{
  display:grid;place-items:center;width:27px;height:27px;flex:0 0 27px;
  font-size:12px;line-height:1;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-3);
  transition:all .22s var(--ease);
}
.nav-item:hover{background:var(--panel-2);color:var(--text);transform:translateX(3px)}
.nav-item:hover .nav-ico{color:var(--text-2);border-color:var(--line-2)}
.nav-item.active{color:var(--iris);background:var(--iris-wash);font-weight:600}
.nav-item.active .nav-ico{
  color:var(--iris);background:var(--iris-wash);border-color:transparent;
  box-shadow:inset 0 0 0 1px var(--iris-glow);
}
.nav-item.active::before{
  content:"";position:absolute;left:-10px;top:50%;width:3px;height:18px;margin-top:-9px;
  background:var(--iris);border-radius:0 3px 3px 0;box-shadow:0 0 12px var(--iris-glow);
  animation:railIn .3s var(--ease-out)
}
@keyframes railIn{from{height:4px;margin-top:-2px;opacity:0}to{height:18px;margin-top:-9px;opacity:1}}
.nav-item.hidden,.nav-section.hidden{display:none}
.sidebar-footer{margin-top:auto;padding:14px 12px;border-top:1px solid var(--line);background:var(--bg-elev)}

#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{
  position:relative;z-index:15;display:flex;align-items:center;gap:16px;flex-shrink:0;
  height:72px;padding:0 26px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
}
#topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--iris-wash),transparent);
}
#topbar-title{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.02em}
#topbar-sub{margin-top:3px;font-size:12.5px;color:var(--text-3)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
#content{flex:1;overflow-y:auto;padding:28px 26px 72px;scroll-padding-top:26px}
.page{display:none}
.page.active{display:block;animation:pageIn .4s var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════════════════════
   5 · CONTROLS
   ═══════════════════════════════════════════════════════════ */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;font-size:13px;font-weight:600;font-family:'Manrope',sans-serif;
  border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;overflow:hidden;
  background:var(--panel-2);color:var(--text-2);
  transition:transform .18s var(--ease),background .18s,color .18s,border-color .18s,box-shadow .22s;
}
.btn:hover{background:var(--panel-3);color:var(--text);transform:translateY(-1px);border-color:var(--line-2)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--iris);border-color:transparent;color:var(--on-accent)}
.btn-primary:hover{background:var(--iris);color:var(--on-accent);filter:brightness(1.08);box-shadow:var(--shadow-glow);border-color:transparent}
.btn-secondary{background:var(--panel-2)}
.btn-danger{background:var(--rose-wash);border-color:transparent;color:var(--rose)}
.btn-danger:hover{background:var(--rose-wash);color:var(--rose);filter:brightness(1.12)}
.btn-warn{background:var(--amber-wash);border-color:transparent;color:var(--amber)}
.btn-warn:hover{background:var(--amber-wash);color:var(--amber);filter:brightness(1.12)}
.btn-blue{background:var(--iris-wash);border-color:transparent;color:var(--iris)}
.btn-blue:hover{background:var(--iris-wash);color:var(--iris);filter:brightness(1.12)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:var(--r-xs)}
.btn-icon{width:38px;height:38px;padding:0;font-size:15px}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:ripple .55s var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}

.theme-switch{
  position:relative;display:inline-flex;align-items:center;gap:0;width:62px;height:32px;padding:3px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:99px;cursor:pointer;flex-shrink:0;
  transition:background .3s,border-color .3s;
}
.theme-switch:hover{border-color:var(--line-2)}
.theme-switch .ts-thumb{
  position:absolute;top:3px;left:3px;width:26px;height:24px;border-radius:99px;background:var(--iris);
  box-shadow:0 4px 12px -4px var(--iris-glow);
  transition:transform .42s var(--ease);
}
:root[data-theme="light"] .theme-switch .ts-thumb{transform:translateX(30px)}
.theme-switch span{
  position:relative;z-index:1;flex:1;display:grid;place-items:center;font-size:13px;line-height:1;
  transition:color .3s,opacity .3s,transform .42s var(--ease);
}
.theme-switch .ts-moon{color:var(--on-accent)}
.theme-switch .ts-sun{color:var(--text-3)}
:root[data-theme="light"] .theme-switch .ts-moon{color:var(--text-3)}
:root[data-theme="light"] .theme-switch .ts-sun{color:var(--on-accent)}

.topbar-search{
  display:flex;align-items:center;gap:9px;min-width:224px;padding:9px 12px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--text-3);font-size:13px;cursor:pointer;transition:border-color .2s,color .2s,background .2s;
}
.topbar-search:hover{border-color:var(--line-2);color:var(--text-2)}
.topbar-search::before{content:"⌕";font-size:15px;line-height:1}
.topbar-search kbd{
  margin-left:auto;padding:2px 6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--text-3);border:1px solid var(--line-2);border-radius:5px;background:var(--panel);
}
.mobile-menu{display:none}
#session-chip{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;font-size:11.5px;color:var(--text-3);
  border:1px solid var(--line);border-radius:99px;white-space:nowrap;background:var(--panel-2);
}
#session-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}

/* ═══════════════════════════════════════════════════════════
   6 · SURFACES
   ═══════════════════════════════════════════════════════════ */
.card{
  position:relative;padding:22px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--shadow-1);
  transition:border-color .25s,box-shadow .25s,transform .25s var(--ease);
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
}
:root[data-theme="light"] .card::before{background:linear-gradient(90deg,transparent,rgba(12,43,40,.06),transparent)}
.card:hover{border-color:var(--line-2);box-shadow:0 1px 2px rgba(0,0,0,.35),0 18px 44px rgba(2,10,22,.42)}
.card-light{background:var(--panel-2)}
.card-label{margin-bottom:8px;font-size:12.5px;font-weight:600;color:var(--text-3)}
.card-value{font-family:'Sora',sans-serif;font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.card-value-lg{font-size:40px}
.card-sub{margin-top:6px;font-size:12px;color:var(--text-3)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.card-title{font-family:'Sora',sans-serif;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.card-tag{
  padding:4px 9px;font-size:11px;font-weight:600;border-radius:99px;
  background:var(--mint-wash);color:var(--mint);white-space:nowrap;
}
.card-tag.blue{background:var(--iris-wash);color:var(--iris)}
.card-tag.red{background:var(--rose-wash);color:var(--rose)}
.panel-title{margin-bottom:16px;font-family:'Sora',sans-serif;font-size:14.5px;font-weight:600}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:18px}
.grid-charts{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:18px}
.grid-charts-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1180px){.grid-charts,.grid-charts-3{grid-template-columns:1fr}}

.chart-wrap{position:relative;height:225px}
.chart-wrap.tall{height:285px}
.chart-wrap.short{height:54px}

/* ═══════════════════════════════════════════════════════════
   7 · HERO
   ═══════════════════════════════════════════════════════════ */
.server-hero{margin-bottom:18px}
.server-banner{
  position:relative;min-height:216px;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
}
.server-banner.has-image{background-size:cover;background-position:center}
.server-banner-shade{
  position:absolute;inset:0;
  background:linear-gradient(100deg,var(--panel) 0%,var(--panel) 26%,transparent 96%),
             radial-gradient(620px 300px at 88% 18%,var(--iris-wash),transparent 70%);
}
#hero-pulse{position:absolute;right:0;bottom:0;left:0;height:78px;width:100%;opacity:.85;pointer-events:none}
.server-banner-content{position:relative;z-index:1;display:flex;align-items:center;gap:20px;padding:28px;min-height:216px}
.server-icon-wrap{position:relative;flex:0 0 auto}
.server-icon{
  width:88px;height:88px;border-radius:26px;object-fit:cover;background:var(--panel-3);
  border:2px solid var(--line-2);box-shadow:var(--shadow-1);
  transition:transform .4s var(--ease),border-color .3s;
}
.server-banner:hover .server-icon{transform:translateY(-3px) rotate(-1.5deg);border-color:var(--iris)}
.server-online-dot{
  position:absolute;right:-3px;bottom:2px;width:19px;height:19px;border-radius:50%;
  background:var(--mint);border:4px solid var(--panel);box-shadow:0 0 16px var(--mint)
}
.server-main{flex:1;min-width:0}
.server-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.server-name{font-family:'Sora',sans-serif;font-size:27px;font-weight:700;letter-spacing:-.035em}
.server-id{margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-3)}
.server-live-pill{
  display:flex;align-items:center;gap:7px;padding:6px 12px;white-space:nowrap;
  font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mint);
  background:var(--mint-wash);border:1px solid transparent;border-radius:99px;
}
.server-live-pill span{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:livePulse 1.8s infinite}
.server-meta-row{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:20px;font-size:13px;color:var(--text-2)}
.server-meta-row b{font-family:'Sora',sans-serif;font-weight:700;color:var(--text)}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

.server-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.server-panel{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-1);min-width:0;position:relative;overflow:hidden}
.server-panel::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
}
.server-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.server-profile-body{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.server-profile-stat{display:flex;flex-direction:column;gap:5px;padding:11px 13px;background:var(--panel-2);border-radius:var(--r-sm);border:1px solid transparent;transition:border-color .2s}
.server-profile-stat:hover{border-color:var(--line)}
.server-profile-stat span{font-size:11.5px;font-weight:600;color:var(--text-3)}
.server-profile-stat b{font-size:13px;font-weight:600;color:var(--text)}
.server-description{margin-top:12px;min-height:38px;font-size:13px;line-height:1.65;color:var(--text-2)}
.bot-profile{display:flex;align-items:center;gap:14px}
.bot-avatar-large{width:58px;height:58px;border-radius:50%;object-fit:cover;background:var(--panel-3);border:2px solid var(--mint);box-shadow:0 0 0 5px var(--mint-wash)}
.bot-name{font-family:'Sora',sans-serif;font-size:17px;font-weight:700}
.bot-handle{margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-3)}
.bot-status-line{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:var(--text-2)}
.bot-live-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint)}
.bot-banner{
  position:relative;height:86px;margin-top:16px;border-radius:var(--r-sm);overflow:hidden;
  background:var(--panel-2) center/cover;border:1px solid var(--line);
}
.bot-banner-label{position:absolute;left:11px;top:9px;z-index:2;font-size:11px;font-weight:600;color:var(--text-2)}
.bot-banner-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--text-3)}
.bot-banner.has-image .bot-banner-empty{display:none}
.live-foot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding:0 4px;font-size:11.5px;color:var(--text-3)}
.live-foot span:first-child{display:flex;align-items:center;gap:7px;color:var(--mint);font-weight:600}
.live-foot i{width:6px;height:6px;border-radius:50%;background:var(--mint);animation:livePulse 1.8s infinite}

/* ─── profile strip ─── */
.profile-strip{
  position:relative;display:flex;align-items:center;gap:20px;margin-bottom:18px;padding:22px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden;
}
.profile-strip::after{
  content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;pointer-events:none;
  background:radial-gradient(circle,var(--iris-wash),transparent 68%);
}
.profile-avatar{
  width:74px;height:74px;flex-shrink:0;border-radius:50%;object-fit:cover;
  background:var(--panel-3);border:2px solid var(--iris);box-shadow:0 0 0 6px var(--iris-wash);
  transition:transform .4s var(--ease)
}
.profile-strip:hover .profile-avatar{transform:scale(1.05)}
.profile-body{position:relative;z-index:1;flex:1;min-width:0}
.profile-name{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.03em}
.profile-handle{margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-3)}
.profile-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:11px;font-size:12.5px;color:var(--text-2)}
.profile-meta span{display:flex;align-items:center;gap:6px}
.role-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.role-badge{padding:4px 10px;font-size:11.5px;font-weight:500;color:var(--text-2);background:var(--panel-2);border:1px solid var(--line);border-radius:99px}
.role-badge.owner{background:var(--iris-wash);border-color:transparent;color:var(--iris);font-weight:700}

/* ═══════════════════════════════════════════════════════════
   8 · OPERATIONS CENTER
   ═══════════════════════════════════════════════════════════ */
.pro-control-center{margin:0 0 18px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.pro-control-center::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
}
.pro-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
.pro-section-head h2{margin:0 0 5px;font-size:21px;font-weight:700}
.pro-section-head p{font-size:13px;color:var(--text-3)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--iris);margin-bottom:8px;text-transform:uppercase}
.pro-actions{display:flex;gap:8px;flex-shrink:0}
.pro-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.pro-metric{
  display:flex;align-items:center;gap:12px;padding:14px;background:var(--panel-2);
  border:1px solid transparent;border-radius:var(--r-sm);transition:transform .22s var(--ease),border-color .22s;
}
.pro-metric:hover{transform:translateY(-2px);border-color:var(--line-2)}
.pro-icon{display:grid;place-items:center;width:34px;height:34px;font-size:14px;background:var(--iris-wash);color:var(--iris);border-radius:10px;border:1px solid transparent}
.pro-metric b{display:block;font-family:'Sora',sans-serif;font-size:16px;font-weight:700}
.pro-metric small{display:block;margin-top:2px;font-size:11.5px;color:var(--text-3)}
.pro-columns{display:grid;grid-template-columns:1.05fr 1.15fr .9fr;gap:12px}
.pro-card{padding:16px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);min-width:0}
.pro-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;font-size:13px;font-weight:700}
.status-chip{padding:4px 9px;font-size:10.5px;font-weight:600;color:var(--text-3);border:1px solid var(--line);border-radius:99px}
.status-chip.live{color:var(--mint);background:var(--mint-wash);border-color:transparent}
.service-list,.security-list{display:flex;flex-direction:column;gap:10px}
.service-row,.security-list div{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-2)}
.service-row b,.security-list b{font-size:12px;font-weight:600;color:var(--mint)}
.svc-dot{display:inline-block;width:6px;height:6px;margin-right:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick-grid button{
  padding:11px 6px;font-size:11.5px;font-weight:500;color:var(--text-2);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;
  transition:transform .2s var(--ease),border-color .2s,color .2s;
}
.quick-grid button:hover{transform:translateY(-2px);border-color:var(--iris);color:var(--text)}
.quick-grid button span{display:block;margin-bottom:5px;font-size:16px;color:var(--iris)}
.pro-bottom{display:grid;grid-template-columns:1fr 296px;gap:12px;margin-top:12px}
.pro-timeline{padding:16px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);min-width:0}
.text-btn{background:none;border:0;color:var(--iris);font-size:12px;font-weight:600;cursor:pointer}
.pro-event{display:flex;gap:12px;padding:9px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.pro-event:last-child{border-bottom:0}
.pro-event-time{min-width:66px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-3)}
.pro-event-kind{min-width:58px;font-weight:700;color:var(--iris)}
.pro-event-text{flex:1;min-width:0;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pro-empty{padding:22px 0;text-align:center;font-size:12.5px;color:var(--text-3)}
.uptime-card{text-align:center}
.runtime-ring{
  position:relative;display:grid;place-items:center;width:118px;height:118px;margin:10px auto 14px;border-radius:50%;
  background:conic-gradient(var(--iris) 0 var(--ring,82%),var(--panel-3) var(--ring,82%));
  transition:background .6s var(--ease);
}
.runtime-ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel-2)}
.runtime-ring div{position:relative;z-index:1}
.runtime-ring strong{display:block;font-family:'Sora',sans-serif;font-size:17px;font-weight:700}
.runtime-ring small{font-size:11px;color:var(--text-3)}
.runtime-meta{display:flex;justify-content:space-around;font-size:11.5px;color:var(--text-3)}
.runtime-meta b{font-weight:600;color:var(--text)}
@media(max-width:1000px){.pro-columns{grid-template-columns:1fr 1fr}.pro-columns .pro-card:last-child{grid-column:1/-1}.pro-bottom{grid-template-columns:1fr}}

/* ═══════════════════════════════════════════════════════════
   9 · DATA + FORMS
   ═══════════════════════════════════════════════════════════ */
.table-scroll{overflow:auto;border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.table-scroll table{min-width:600px}
table th{padding:10px 12px;text-align:left;font-size:11.5px;font-weight:600;color:var(--text-3);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
table td{padding:13px 12px;vertical-align:middle;border-bottom:1px solid var(--line)}
table tr:last-child td{border-bottom:none}
table tbody tr{transition:background .16s}
table tbody tr:hover td{background:var(--panel-2)}
table code{font-size:12.5px;color:var(--text-2)}

.log-item{display:flex;align-items:center;gap:14px;padding:13px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:none}
.log-time{min-width:74px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-3)}
.log-kind{
  min-width:86px;padding:4px 9px;text-align:center;font-size:11px;font-weight:600;border-radius:99px;
  background:var(--panel-2);color:var(--text-2);
}
.log-kind.whitelist{background:var(--mint-wash);color:var(--mint)}
.log-kind.admin{background:var(--iris-wash);color:var(--iris)}
.log-kind.backup{background:var(--violet-wash);color:var(--violet)}
.log-text{flex:1;color:var(--text-2)}

.audit-row{display:flex;align-items:center;gap:13px;padding:13px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.audit-row:last-child{border-bottom:none}
.audit-av{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:var(--panel-3);object-fit:cover}
.audit-action{padding:3px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;color:var(--iris);background:var(--iris-wash);border-radius:99px;white-space:nowrap}
.audit-meta{font-size:12px;color:var(--text-3)}

.setting-row{
  display:flex;align-items:center;gap:16px;margin-bottom:8px;padding:14px 18px;
  background:var(--panel-2);border:1px solid transparent;border-radius:var(--r-sm);
  transition:border-color .2s,background .2s;
}
.setting-row:hover{border-color:var(--line)}
.setting-row>div:first-child{flex:1;font-size:13.5px}
.setting-row .input-sm{background:var(--panel)}
.toggle{position:relative;width:44px;height:25px;flex-shrink:0}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.toggle-track{position:absolute;inset:0;border-radius:99px;background:var(--panel-3);cursor:pointer;transition:background .28s var(--ease)}
.toggle input:checked~.toggle-track{background:var(--mint)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.toggle input:checked~.toggle-track .toggle-thumb{transform:translateX(19px)}
.toggle input:focus-visible~.toggle-track{outline:2px solid var(--iris);outline-offset:3px}

.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px;margin-top:9px}
.perm-btn{
  padding:10px;text-align:center;font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;user-select:none;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-xs);
  transition:all .16s var(--ease);
}
.perm-btn:hover{border-color:var(--line-2);color:var(--text)}
.perm-btn.on{background:var(--iris-wash);border-color:var(--iris);color:var(--iris);font-weight:600}

/* ══ ACCESS CONTROL ══ */
.access-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--panel),var(--panel-2));}
.access-hero::after{content:"";position:absolute;width:300px;height:300px;right:-100px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(79,209,197,.18),transparent 68%);pointer-events:none}
.access-hero-grid{display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:1}
.access-title{font-family:'Sora',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:3px}
.access-owner-badge{display:flex;align-items:center;gap:11px;padding:12px 15px;border:1px solid var(--line-2);background:rgba(255,255,255,.035);border-radius:14px;min-width:250px}
.access-owner-badge strong{display:block;font-size:12.5px}
.access-owner-badge small{display:block;color:var(--text-3);font-size:10.5px;margin-top:2px}
.access-lock{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--iris-wash);color:var(--iris);font-size:17px}
.access-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.access-stat{padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow-1)}
.access-stat b{display:block;font-family:'Sora';font-size:20px}
.access-stat span{display:block;color:var(--text-3);font-size:11px;margin-top:3px}
.access-control-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.access-switch-card{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.access-switch-card input{margin-top:3px;accent-color:var(--iris)}
.access-switch-card strong{display:block;font-size:12.5px}
.access-switch-card small{display:block;color:var(--text-3);font-size:10.5px;line-height:1.45;margin-top:3px}
.access-perm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 9px}
.access-perm-head>div:first-child{display:flex;align-items:center;gap:8px}
