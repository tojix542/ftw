<!-- FTW Control Center: Purity UI theme + Discord profile sync + fixes.
     Paste this whole block ONCE in index.html, right before </body>. -->
<style id="ftw-purity">
:root{--pu:linear-gradient(135deg,#4FD1C5,#319795)}
html:root[data-theme=light]{--bg:#F8F9FA;--bg-elev:#fff;--panel:#fff;--panel-2:#F4F7FA;--panel-3:#E2E8F0;--line:#E2E8F0;--line-2:#CBD5E0;--line-3:#A0AEC0;--text:#2D3748;--text-2:#4A5568;--text-3:#718096;--mint:#2F855A;--mint-wash:rgba(56,161,105,.12);--rose:#E53E3E;--rose-wash:rgba(229,62,62,.1);--amber:#C05621;--amber-wash:rgba(221,107,32,.12);--violet:#3182CE;--violet-wash:rgba(66,153,225,.12);--on-accent:#fff;--shadow-1:0 3.5px 5.5px rgba(0,0,0,.05);--shadow-2:0 20px 45px rgba(45,55,72,.22);--scrim:rgba(45,55,72,.5);--sheen:rgba(0,0,0,.05)}
html:root[data-theme=dark]{--bg:#0F1535;--bg-elev:#111C44;--panel:#111C44;--panel-2:#1B2559;--panel-3:#273469;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);--line-3:rgba(255,255,255,.3);--text:#F7FAFC;--text-2:#CBD5E0;--text-3:#8F9BBA;--mint:#68D391;--rose:#FC8181;--amber:#F6AD55;--violet:#63B3ED;--on-accent:#0F1535;--shadow-1:0 3.5px 5.5px rgba(0,0,0,.25);--shadow-2:0 20px 45px rgba(0,0,0,.5);--scrim:rgba(6,11,40,.72)}
html:root[data-accent=violet]{--iris:#38B2AC;--iris-2:#2C7A7B;--iris-deep:#285E61;--iris-wash:rgba(79,209,197,.16);--iris-glow:rgba(79,209,197,.5);--shadow-glow:0 10px 24px -10px rgba(49,151,149,.65)}
html:root[data-theme=dark][data-accent=violet]{--iris:#4FD1C5;--iris-2:#81E6D9;--iris-deep:#319795}
body::before,body::after{display:none}
body{background:var(--bg);color:var(--text)}
@media(min-width:921px){#sidebar{margin:14px 0 14px 14px;height:calc(100vh - 28px)}}
#sidebar{background:var(--panel)!important;border:0;border-radius:15px;box-shadow:var(--shadow-1);backdrop-filter:none}
.sidebar-header,.sidebar-footer{background:transparent!important}
.brand-mark{background:var(--pu)!important;border:0;box-shadow:0 6px 14px -6px #319795}
.brand-mark img{filter:brightness(0) invert(1)}
.brand-name{background:none!important;-webkit-text-fill-color:var(--text);color:var(--text);font-size:15px}
.sidebar-status{background:var(--panel-2);border:0}
.nav-section{color:var(--text);letter-spacing:0;text-transform:none;font-size:12.5px;padding:16px 22px 6px}
.nav-item{border:0;border-radius:15px;margin:2px 12px;color:var(--text-3);font-weight:700;font-size:13px}
.nav-item .nav-ico{background:var(--panel);border:0;border-radius:12px;box-shadow:var(--shadow-1);color:#38B2AC}
.nav-item:hover{background:transparent;color:var(--text)}
.nav-item.active{background:var(--panel);color:var(--text);box-shadow:0 7px 23px rgba(0,0,0,.09)}
.nav-item.active .nav-ico{background:var(--pu);color:#fff;box-shadow:none}
.nav-item.active::before{display:none}
#topbar{background:transparent!important;border:0;box-shadow:none;backdrop-filter:none;margin:14px 14px 0}
#topbar::after{display:none}
#topbar-title{font-size:16px;font-weight:700}
.tb-icon-btn,.theme-switch,.topbar-search,#session-chip,#sync-indicator,.api-status-pill{background:var(--panel);border:0;box-shadow:var(--shadow-1)}
.card,.server-panel,.pro-control-center,.profile-strip,.glance-cell,.pro-timeline,.access-stat,.ws-table-wrap{background:var(--panel)!important;border:0!important;border-radius:15px;box-shadow:var(--shadow-1)}
.card::before,.server-panel::before,.pro-control-center::before,.auth-card::before,.ban-dialog::before{display:none}
.card:hover{transform:none;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.pro-card,.pro-metric,.server-profile-stat,.setting-row,.lookup-grid>div{background:var(--panel-2)!important;border-color:transparent}
.glance-ico,.pro-icon{background:var(--pu)!important;color:#fff!important;border-radius:12px}
.card-value{color:var(--text)}
.server-banner{border:0;border-radius:15px;background:linear-gradient(81deg,#2C7A7B,#4FD1C5);box-shadow:var(--shadow-1)}
.server-banner-shade{background:linear-gradient(90deg,rgba(23,84,85,.92),rgba(49,151,149,.5) 55%,transparent)}
.server-name,.server-meta-row,.server-meta-row b,.server-id{color:#fff}
.server-icon{border-color:#fff}.server-online-dot{border-color:#319795}
.btn{border:0;border-radius:12px;background:var(--panel-2);color:var(--text-2)}
.btn:hover{background:var(--panel-3);color:var(--text)}
.btn-primary,.btn-login{background:var(--pu)!important;color:#fff!important;border:0}
.btn-primary::before{display:none}
.btn-danger{background:var(--rose-wash);color:var(--rose)}.btn-warn{background:var(--amber-wash);color:var(--amber)}.btn-blue{background:var(--iris-wash);color:var(--iris-2)}
.field input,.field select,.field textarea,.input-sm,.ban-field input,.ban-field select,.ban-field textarea,.command-input{background:var(--panel)!important;border:1px solid var(--line-2);border-radius:12px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus,.input-sm:focus{border-color:#4FD1C5;box-shadow:0 0 0 3px rgba(79,209,197,.25)}
.toggle input:checked~.toggle-track{background:#4FD1C5}
.ban-dialog,.command-dialog,.popover,.ws-overlay-card,.auth-card{background:var(--panel)!important;border:0;box-shadow:var(--shadow-2)}
table th{text-transform:none;letter-spacing:0;color:var(--text-3)}
.save-bar{background:var(--panel);border-color:#4FD1C5}
.save-bar.show{transform:none;opacity:1}
.notif-badge{display:grid}
/* login */
#auth-screen{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);grid-template-rows:1fr auto auto 1fr;justify-items:center;gap:22px 0;padding:0 28px 0 0;background:var(--bg)}
#auth-screen::before,#auth-screen::after{display:none}
.pu-hero{grid-column:1;grid-row:1/-1;align-self:stretch;justify-self:stretch;position:relative;overflow:hidden;margin:14px 0 14px 14px;padding:56px;border-radius:20px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(135deg,#285E61,#319795 55%,#4FD1C5)}
.pu-hero svg{position:absolute;left:0;bottom:0;width:100%;height:170px;opacity:.2}
.pu-hero-in{position:relative;max-width:460px}
.pu-hero h1{font-size:38px;line-height:1.12;font-weight:800;margin-bottom:14px}
.pu-hero p{opacity:.92;line-height:1.6;margin-bottom:20px}
.pu-hero li{list-style:none;display:flex;align-items:center;gap:10px;padding:6px 0;font-weight:600}
.pu-hero li::before{content:"\2713";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);font-size:12px}
.auth-logo{grid-column:2;grid-row:2}.auth-card{grid-column:2;grid-row:3;width:min(400px,100%);padding:34px}
.auth-mark{background:var(--pu)!important;border:0}.auth-mark img{filter:brightness(0) invert(1)}
.auth-wordmark{background:none!important;-webkit-text-fill-color:var(--text);color:var(--text);font-size:26px}
.auth-wordmark span{color:var(--text-3);-webkit-text-fill-color:var(--text-3)}
@media(max-width:900px){#auth-screen{grid-template-columns:1fr;padding:0 16px}.pu-hero{display:none}.auth-logo,.auth-card{grid-column:1}}
/* synced Discord profiles */
.dp{display:inline-flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.dp-av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--panel-3);color:var(--text-2);font-weight:800;font-size:13px}
.dp b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.dp small{display:block;font:11px 'IBM Plex Mono',monospace;color:var(--text-3)}
.dp:hover b{color:var(--iris-2)}
.log-row .dp{flex:0 0 230px}
.lk{padding:14px 0;border-bottom:1px solid var(--line)}.lk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lk-roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#dp-card{position:fixed;z-index:1500;width:290px;background:var(--panel);border-radius:15px;box-shadow:var(--shadow-2);overflow:hidden}
.dp-ban{height:66px;background:var(--pu) center/cover}.dp-bd{padding:0 16px 16px;margin-top:-28px}
.dp-av.lg{width:58px;height:58px;flex-basis:58px;border:3px solid var(--panel);font-size:20px}
.dp-bd h4{font-family:Sora,sans-serif;font-size:15px;margin-top:8px}.dp-bd .mono{font-size:11px;color:var(--text-3);word-break:break-all}
.dp-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
</style>
<script id="ftw-purity-js">
(function(){
if(window.__purity)return;window.__purity=1;
const $=id=>document.getElementById(id);

/* 1. API compat: the dashboard sent field names the bot never read (cause of "unknown action") */
const IN={
 '/api/action/backup':b=>({action:b.op==='create'?'run':(b.op||b.action)}),
 '/api/action/admin':b=>{if(b.op){b.action=b.op;delete b.op}return b},
 '/api/user-scan/blacklist':b=>({action:b.op||b.action,guild_id:b.id||b.guild_id}),
 '/api/staff/add':b=>({discord_id:b.id,name:b.name,password:b.password,full_control:b.full_control,manage_access:b.manage_access,perms:Object.fromEntries((b.permissions||[]).map(p=>[p,true]))}),
 '/api/config':b=>{if(b.ai_channels){b.ai_channel_ids=b.ai_channels.map(String);delete b.ai_channels}return b}
};
const IDKEY=/^\/api\/(whitelist\/(add|remove)|discord-bans\/(add|remove)|staff\/(update|remove))$/;
const OUT={
 '/api/ip-logs':d=>{(d.logs||[]).forEach(l=>{l.user=l.display_name||l.username;l.ip_banned=!!(d.bans&&d.bans[l.ip])});return d},
 '/api/user-scan/blacklist':d=>{if(d.blacklisted)d.entries=d.blacklisted.map(id=>({id}));return d},
 '/api/config':d=>{d.ai_channels=d.ai_channel_ids;return d}
};
const wrap=f=>async function(p,o){o=o||{};const path=String(p).split('?')[0];
 if(typeof o.body==='string'){try{let b=JSON.parse(o.body);
  if(IN[path])b=IN[path](b);else if(IDKEY.test(path)&&b.id&&!b.discord_id)b.discord_id=b.id;
  o=Object.assign({},o,{body:JSON.stringify(b)})}catch(e){}}
 const r=await f(p,o);
 if(OUT[path]&&r.ok&&(o.method||'GET')==='GET'){try{return new Response(JSON.stringify(OUT[path](await r.clone().json())),{status:r.status,headers:{'Content-Type':'application/json'}})}catch(e){}}
 return r};
fetchApi=wrap(fetchApi);apiFetch=wrap(apiFetch);
const _cc=collectConfig;
collectConfig=function(){const o=_cc();document.querySelectorAll('input[type=number][data-key]').forEach(e=>{if(e.value!=='')o[e.dataset.key]=Number(e.value)});return o};

/* 2. Discord profile sync: one cache, every page */
const DP=window.DP={c:new Map,q:new Map,n:0,w:[],
 async slot(){if(this.n<4){this.n++;return}await new Promise(r=>this.w.push(r))},
 free(){const r=this.w.shift();r?r():this.n--},
 async get(id){id=String(id||'');if(!/^\d{15,25}$/.test(id))return null;
  const h=this.c.get(id);if(h&&Date.now()-h.t<6e5)return h.p;
  if(this.q.has(id))return this.q.get(id);
  const pr=(async()=>{await this.slot();try{const r=await fetchApi('/api/discord-profile?id='+id,{headers:hdr()});const p=r.ok?(await r.json()).user:null;this.c.set(id,{p,t:Date.now()});return p}catch(e){return null}finally{this.free();this.q.delete(id)}})();
  this.q.set(id,pr);return pr},
 chip(id,name,av,sub){return `<span class="dp" data-uid="${esc(id)}" title="Open profile">${av?`<img class="dp-av" src="${esc(bust(av))}" alt="">`:`<span class="dp-av">${esc(String(name||'?')[0].toUpperCase())}</span>`}<span><b>${esc(name||id)}</b><small>${esc(sub||id)}</small></span></span>`},
 async paint(root){await Promise.all([...(root||document).querySelectorAll('.dp[data-uid]')].map(async el=>{
  const p=await DP.get(el.dataset.uid);if(!p)return;const k=(p.avatar||'')+p.display_name;if(el.dataset.k===k)return;el.dataset.k=k;
  const a=el.querySelector('.dp-av');if(p.avatar)a.outerHTML=`<img class="dp-av" src="${esc(bust(p.avatar))}" alt="">`;
  el.querySelector('b').textContent=p.display_name||p.username;el.querySelector('small').textContent='@'+p.username}))}
};
new MutationObserver(m=>{if(m.some(x=>[...x.addedNodes].some(n=>n.nodeType===1&&(n.matches('.dp')||n.querySelector('.dp'))))){clearTimeout(DP.t);DP.t=setTimeout(()=>DP.paint(),80)}}).observe(document.body,{childList:true,subtree:true});
setInterval(()=>DP.paint(),60000);

/* profile card with quick actions */
window.dpLook=id=>{nav('userlookup');$('lookup-user').value=id};
window.dpBan=id=>{openBanModal();$('ban-user-id').value=id};
document.addEventListener('click',async e=>{const old=$('dp-card');if(old)old.remove();const el=e.target.closest('.dp');if(!el)return;
 const id=el.dataset.uid,p=(await DP.get(id))||{display_name:id,username:'unknown'},r=el.getBoundingClientRect(),c=document.createElement('div');
 c.id='dp-card';c.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-270))+'px';c.style.left=Math.max(8,Math.min(r.left,innerWidth-300))+'px';
 c.innerHTML=`<div class="dp-ban" style="${p.banner?`background-image:url('${esc(bust(p.banner))}')`:''}"></div><div class="dp-bd">${p.avatar?`<img class="dp-av lg" src="${esc(bust(p.avatar))}" alt="">`:`<span class="dp-av lg">${esc(String(p.display_name||'?')[0].toUpperCase())}</span>`}<h4>${esc(p.display_name||id)}</h4><div class="mono">@${esc(p.username||'unknown')} &middot; ${esc(id)}</div>${p.created_at?`<div class="mono" style="margin-top:4px">Account created ${fmtTime(p.created_at)}</div>`:''}<div class="dp-act"><button class="btn btn-sm" onclick="copyText('${esc(id)}','User ID')">Copy ID</button><button class="btn btn-sm btn-blue" onclick="dpLook('${esc(id)}')">Look up</button>${isOwner()?`<button class="btn btn-sm btn-danger" onclick="dpBan('${esc(id)}')">Ban</button>`:''}</div></div>`;
 document.body.appendChild(c)});

/* 3. Pages that show people now show real Discord profiles */
const empty=t=>`<div class="empty-state"><strong>${t}</strong></div>`;
loadLogs=async function(){const b=$('logs-list');if(!b)return;
 try{const r=await fetchApi('/api/logs',{headers:hdr()}),L=(r.ok?await r.json():{}).logs||[];detectLogNotifs(L);
  b.innerHTML=L.length?L.map(l=>{const d=l.details||{},uid=d.member_id||d.user_id||'',n=logDisplayName(l);
   return `<div class="log-row">${uid?DP.chip(uid,n):`<span class="dp-av">${esc(String(n)[0].toUpperCase())}</span>`}<span class="log-kind">${esc(l.kind||'event')}</span><span class="log-text">${esc(l.text||'')}</span><span class="log-time">${fmtRel(l.time)}</span></div>`}).join(''):empty('No activity yet');
  DP.paint(b)}catch(e){b.innerHTML=empty('Logs unavailable')}};
loadAudit=async function(){const b=$('audit-list');if(!b)return;
 try{const r=await fetchApi('/api/audit',{headers:hdr()}),E=(r.ok?await r.json():{}).entries||[];
  b.innerHTML=E.length?E.map(a=>`<div class="log-row">${a.user_id?DP.chip(a.user_id,a.user,a.user_avatar):'<span class="dp-av">S</span>'}<span class="log-kind">${esc(String(a.action||'change').replace(/_/g,' '))}</span><span class="log-text">${esc([a.target&&'\u2192 '+a.target,a.reason&&'\u00b7 '+a.reason].filter(Boolean).join(' '))}</span><span class="log-time">${fmtRel(a.created_at)}</span></div>`).join(''):empty('No audit entries');
  DP.paint(b)}catch(e){b.innerHTML=empty('Audit unavailable')}};
loadWhitelist=async function(){const b=$('wl-rows');if(!b)return;
 try{const r=await fetchApi('/api/whitelist',{headers:hdr()}),d=r.ok?await r.json():{},L=d.whitelist||[];$('wl-enabled').checked=d.enabled!==false;
  b.innerHTML=L.length?L.map(w=>`<tr><td class="mono">${esc(w.id)}</td><td>${DP.chip(w.id,w.username)}</td><td>${esc(w.added_by_name||'\u2014')}</td><td>${esc(w.reason||'\u2014')}</td><td style="text-align:right"><button class="btn btn-danger btn-sm" onclick="removeWhitelist('${esc(w.id)}')">Remove</button></td></tr>`).join(''):`<tr><td colspan="5">${empty('No one is whitelisted yet')}</td></tr>`;
  DP.paint(b)}catch(e){}};
loadStaff=async function(){const b=$('staff-rows');if(!b)return;
 try{const r=await fetchApi('/api/staff',{headers:hdr()}),S=r.ok?(await r.json()).staff||[]:[],st=$('access-stats');
  if(st)st.innerHTML=`<div class="ws-stat"><b>${S.length}</b><span>Operators</span></div><div class="ws-stat"><b>${S.filter(s=>s.full_control).length}</b><span>Full control</span></div><div class="ws-stat"><b>${S.filter(s=>s.manage_access).length}</b><span>Manage access</span></div>`;
  b.innerHTML=S.length?S.map(s=>{const m=Object.keys(s.perms||{}).filter(k=>s.perms[k]&&k!=='*').map(k=>PAGE_NAMES[k]||k).join(', ');
   return `<tr><td>${DP.chip(s.id,s.name)}</td><td><span class="status-chip ${s.full_control?'live':''}">${s.full_control?'Full control':esc(s.role)}</span></td><td style="font-size:12px;max-width:280px">${s.full_control?'All modules':esc(m||'None')}</td><td>${s.manage_access?'Yes':'No'}</td><td style="text-align:right"><button class="btn btn-danger btn-sm" onclick="removeStaff('${esc(s.id)}')">Remove</button></td></tr>`}).join(''):`<tr><td colspan="5">${empty('No operators yet')}</td></tr>`;
  DP.paint(b)}catch(e){}};
function showLookup(list){$('lookup-empty').style.display='none';const b=$('lookup-result');b.style.display='block';
 b.innerHTML=list.length?list.map(x=>{const m=x.member,a=crossReferenceWaveShield({id:m.id,username:m.username,display_name:m.display_name});
  return `<div class="lk"><div class="lk-h">${DP.chip(m.id,m.display_name,m.avatar,'@'+m.username)}<span class="status-chip">${esc(x.guild.name)}</span>${a.length?`<span class="ws-alt-badge">${a.length} WaveShield match${a.length>1?'es':''}</span>`:''}</div><div class="lk-roles">${x.roles.map(r=>`<span class="role-chip" style="border-color:${esc(r.colour)}">${esc(r.name)}</span>`).join('')||'<span class="muted">No roles</span>'}</div></div>`}).join(''):empty('No matches');
 DP.paint(b)}
lookupUser=async function(){const g=val('lookup-guild-id'),q=val('lookup-user');if(!/^\d{15,25}$/.test(g)||!q)return toast('Enter a server ID and a user',false);
 try{const r=await fetchApi(`/api/user-lookup?guild_id=${g}&user=${encodeURIComponent(q)}`,{headers:hdr()}),d=await r.json();if(!r.ok)throw Error(d.error||'Not found');showLookup([d])}catch(e){toast(e.message,false)}};
scanAllServers=async function(){const q=val('lookup-user');if(!q)return toast('Enter a user to scan for',false);
 try{const r=await fetchApi('/api/user-scan?user='+encodeURIComponent(q),{headers:hdr()}),d=await r.json();if(!r.ok)throw Error(d.error||'Scan failed');showLookup(d.results||[]);toast(`Found in ${d.found_count} of ${d.checked_count} servers`)}catch(e){toast(e.message,false)}};

/* 4. Login page hero + unsaved-changes guard */
const a=$('auth-screen');
if(a&&!a.querySelector('.pu-hero'))a.insertAdjacentHTML('afterbegin','<div class="pu-hero"><svg viewBox="0 0 600 170" preserveAspectRatio="none"><path fill="#fff" d="M0 90C110 20 210 150 320 85S510 30 600 80V170H0Z"/></svg><div class="pu-hero-in"><h1>Your whole Discord server, one dashboard.</h1><p>Moderation, protection, backups and voice rooms, with every member shown as their real Discord profile.</p><ul><li>Live Discord profile sync</li><li>AntiNuke and scam protection</li><li>One-click backups</li></ul></div></div>');
addEventListener('beforeunload',e=>{if(typeof dirty!=='undefined'&&dirty){e.preventDefault();e.returnValue=''}});
})();
</script>
